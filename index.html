<title>White Rabbit Candy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="大白兔奶糖, the White Rabbit creamy candy from Shanghai: what it is, its history since 1943, the 1972 diplomatic gift, its kinds and its place in pop culture, in English, German and Chinese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: the page is the candy's wrapper unrolled — white paper printed in wrapper blue with red,
   chapters laid out like panels of the print, the candy and the rabbit carrying all the motion.
   One look by design (the wrapper is white), so there is no dark palette. */
:root {
  --paper: #FFFFFF;          /* wrapper paper */
  --milk: #FBF6E9;           /* the candy */
  --milk-deep: #EFE2C4;
  --blue: #1D4EA6;           /* wrapper print */
  --ink: #13295C;            /* text: the print's darkest blue */
  --red: #E1252B;            /* wrapper red, used sparingly */
  --pink: #F6B4C3;           /* inside the rabbit's ears */
  --red-ink: #C4161C;        /* red for small text: passes 4.5:1 on white and milk */
  --muted: #56617C;
  --hair: rgba(29, 78, 166, .14);
  --wash: rgba(29, 78, 166, .05);

  --f-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Figtree", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-zh-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  --step--1: clamp(.82rem, .78rem + .2vw, .92rem);
  --step-0: clamp(1rem, .95rem + .25vw, 1.12rem);
  --step-1: clamp(1.2rem, 1.08rem + .6vw, 1.5rem);
  --step-2: clamp(1.55rem, 1.3rem + 1.3vw, 2.25rem);
  --step-3: clamp(2.1rem, 1.6rem + 2.6vw, 3.6rem);
  --step-4: clamp(3rem, 2rem + 5.4vw, 6.4rem);

  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--step-0)/1.6 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html:lang(zh-Hans) body { font-family: var(--f-zh); line-height: 1.75; }
html:lang(de) body { hyphens: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--red); outline-offset: 3px; border-radius: 8px; }
a { color: var(--blue); text-underline-offset: .18em; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.bar { position: fixed; z-index: 30; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
.bar-in { display: flex; align-items: center; gap: 12px; height: 60px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.bar-in > * { pointer-events: auto; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 6px 14px 6px 8px; box-shadow: 0 0 0 1px var(--hair); }
.mark svg { width: 38px; height: 27px; display: block; --rw: 11; --rwl: 7.5; }
/* the rabbit's line weight, in its 240-unit box: heavier where it is drawn small */
.rb .k-main, .rb .k-back { stroke-width: var(--rw, 5); }
.rb .k-line { stroke-width: var(--rwl, 3.5); }
.mark b { font: 400 21px/1 var(--f-zh-display); letter-spacing: .04em; color: var(--blue); }
.bar .sp { flex: 1; }
.fps { display: none; font: 600 12px/1 var(--f-body); letter-spacing: .06em; color: var(--muted); background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 9px 12px; box-shadow: 0 0 0 1px var(--hair); font-variant-numeric: tabular-nums; align-items: center; gap: 7px; white-space: nowrap; }
html.show-fps .fps { display: flex; }
.fps i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.langs { display: flex; background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 4px; box-shadow: 0 0 0 1px var(--hair); position: relative; }
.langs button { position: relative; z-index: 1; min-height: 36px; min-width: 44px; padding: 7px 13px; border-radius: 999px; font: 600 13px/1 var(--f-body); letter-spacing: .04em; color: var(--muted); transition: color .25s; }
.langs button[aria-pressed="true"] { color: #fff; }
.langs button:lang(zh) { font-family: var(--f-zh); letter-spacing: 0; }
.langs .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 10px; border-radius: 999px; background: var(--blue); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1), width .45s cubic-bezier(.3, 1.4, .5, 1); }
.progress { position: fixed; z-index: 31; left: 0; top: 0; height: 3px; width: 100%; background: var(--red); transform-origin: 0 50%; transform: scaleX(0); }
@media (max-width: 400px) { html.show-fps .fps { display: none; } }
@media (max-width: 520px) { .mark b { font-size: 19px; } .langs button { padding: 7px 10px; } }

/* ---------- hero: the candy unwraps as you scroll ---------- */
.hero { position: relative; height: 270vh; height: 270svh; }
.hero-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
#candy { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-copy { position: absolute; z-index: 2; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 84px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.hero-copy .in { max-width: 560px; }
.eyebrow { margin: 0; font: 600 var(--step--1)/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
html:lang(zh-Hans) .eyebrow { letter-spacing: .12em; font-family: var(--f-zh); }
.hero h1 { margin: 14px 0 0; display: grid; gap: 4px; line-height: .9; }
.hero h1 .zh { font: 400 clamp(4.2rem, 3rem + 9vw, 9.5rem)/1 var(--f-zh-display); color: var(--blue); letter-spacing: .02em; display: flex; }
.hero h1 .zh span { display: inline-block; will-change: transform; }
.hero h1 .lat { font: 700 var(--step-3)/1 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; letter-spacing: -.02em; color: var(--ink); }
.hero h1 .lat em { font-style: italic; font-weight: 400; color: var(--red); }
.lede { margin: 18px 0 0; max-width: 34ch; font-size: var(--step-1); line-height: 1.45; color: var(--ink); text-wrap: pretty; }
html:lang(zh-Hans) .lede { max-width: 22em; }
.steps { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 640px; }
.steps li { min-width: 0; display: grid; gap: 8px; font: 500 var(--step--1)/1.35 var(--f-body); color: var(--muted); transition: color .35s; }
.steps li .bar2 { height: 3px; border-radius: 3px; background: var(--hair); overflow: hidden; }
.steps li .bar2 i { display: block; height: 100%; background: var(--blue); transform-origin: 0 50%; transform: scaleX(0); }
.steps li b { font-weight: 700; color: var(--ink); display: block; }
.steps li.on { color: var(--ink); }
.cue { position: absolute; z-index: 2; right: var(--gutter-r); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.cue i { width: 22px; height: 34px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hair); position: relative; }
.cue i::after { content: ""; position: absolute; left: 50%; top: 7px; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; background: var(--blue); animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }
@media (orientation: portrait), (max-width: 860px) {
  .hero-copy { top: calc(env(safe-area-inset-top, 0px) + 76px); }
  .steps ol { max-width: none; }
  .cue { display: none; }
}

/* ---------- chapters ---------- */
.chapter { position: relative; padding-block: clamp(80px, 12vh, 150px); }
#kinds { overflow-x: clip; }   /* the ring is wider than a phone screen */
.ch-head { display: grid; gap: 10px; margin-bottom: clamp(28px, 5vh, 56px); }
.ch-head .zh { font: 400 var(--step-2)/1 var(--f-zh-display); color: var(--red); letter-spacing: .06em; }
.ch-head .zh.alt { font: 700 var(--step--1)/1.2 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--red-ink); }
html:lang(zh-Hans) .hero h1 .lat { font: 400 var(--step-3)/1.05 var(--f-zh-display); letter-spacing: .06em; }
html:lang(zh-Hans) .hero h1 .lat em { font-style: normal; font-weight: 400; }
.ch-head h2 { margin: 0; font: 650 var(--step-4)/.95 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 144; letter-spacing: -.03em; color: var(--blue); text-wrap: balance; }
html:lang(zh-Hans) .ch-head h2 { font: 400 var(--step-4)/1.05 var(--f-zh-display); letter-spacing: .04em; }
.ch-head p { margin: 4px 0 0; max-width: 60ch; font-size: var(--step-1); line-height: 1.5; color: var(--muted); text-wrap: pretty; }
.prose p { margin: 0 0 1em; max-width: 62ch; text-wrap: pretty; }
.prose p:last-child { margin-bottom: 0; }
.prose b { color: var(--blue); font-weight: 700; }
.split { display: grid; gap: clamp(32px, 6vw, 80px); }
.split > * { min-width: 0; }
@media (min-width: 700px) and (orientation: landscape) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; } .split.flip > :first-child { order: 2; } }

/* the wrapper's printed band between chapters */
.band { height: 64px; overflow: hidden; border-block: 2px solid var(--blue); background: var(--paper); }
.band .run { display: flex; gap: 0; height: 100%; align-items: center; white-space: nowrap; will-change: transform; }
.band .run > span { display: inline-flex; align-items: center; gap: 22px; padding-right: 22px; font: 400 26px/1 var(--f-zh-display); color: var(--blue); letter-spacing: .06em; }
.band .run > span em { font: 700 17px/1 var(--f-display); font-style: normal; letter-spacing: .18em; color: var(--red); font-variation-settings: "SOFT" 100, "opsz" 24; }
.band .run svg { width: 46px; height: 33px; --rw: 10; --rwl: 7; }

/* ---------- what it is: 7 candies, one glass ---------- */
.facts3 { display: grid; gap: 14px; margin-top: 28px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.facts3 div { min-width: 0; padding: 16px 14px; border-radius: 18px; background: var(--milk); }
.facts3 b { display: block; font: 700 var(--step-2)/1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 72; color: var(--blue); font-variant-numeric: tabular-nums; }
.facts3 div > span { display: block; margin-top: 8px; font-size: var(--step--1); line-height: 1.35; color: var(--muted); }
@media (max-width: 420px) { .facts3 { grid-template-columns: 1fr; } .facts3 div { display: flex; align-items: baseline; gap: 12px; } .facts3 div > span { margin: 0; } }
.glass-box { position: relative; display: grid; justify-items: center; gap: 18px; padding: 24px 12px 20px; border-radius: 28px; background: linear-gradient(180deg, var(--wash), transparent 70%); }
.glass-box svg.glass { width: min(260px, 62vw); height: auto; overflow: visible; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 44px; }
.tray button { width: 64px; height: 44px; padding-block: 7px; border-radius: 8px; position: relative; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), opacity .25s; }
.tray button:hover { transform: translateY(-3px) rotate(-4deg); }
.tray button[disabled] { opacity: .18; transform: scale(.8); cursor: default; }
.tray button svg { width: 100%; height: 100%; display: block; overflow: visible; }
.glass-read { text-align: center; font: 600 var(--step-0)/1.3 var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.glass-read small { display: block; margin-top: 4px; font-weight: 400; font-size: var(--step--1); color: var(--muted); }
.glass-ctl { display: flex; gap: 10px; }
.chip { padding: 15px 18px; border-radius: 999px; font: 600 14px/1 var(--f-body); background: var(--blue); color: #fff; transition: transform .2s; }
.chip.ghost { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--hair); }
.chip:active { transform: scale(.96); }
.flyer { position: fixed; z-index: 40; left: 0; top: 0; width: 64px; height: 30px; pointer-events: none; will-change: transform; }
.note { margin-top: 14px; font-size: var(--step--1); color: var(--muted); max-width: 60ch; }

/* ---------- history: a horizontal track, the rabbit hops along it ---------- */
.history { position: relative; }
.history .ch-head { padding-top: clamp(80px, 12vh, 150px); }
.h-pin { position: relative; }
.h-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; }
.track { display: flex; gap: clamp(18px, 3vw, 36px); padding-left: max(var(--gutter-l), calc((100vw - 1200px) / 2 + 16px)); padding-right: 30vw; will-change: transform; align-items: stretch; }
.card { flex: none; width: min(78vw, 400px); min-width: 0; padding: 26px 22px 24px; border-radius: 26px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--hair), 0 30px 60px -40px rgba(19, 41, 92, .35); display: grid; align-content: start; gap: 10px; position: relative; }
.card .yr { font: 700 clamp(2.6rem, 2rem + 2.4vw, 3.8rem)/1 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; color: var(--red); letter-spacing: -.03em; font-variant-numeric: lining-nums; }
.card h3 { margin: 0; font: 650 var(--step-1)/1.2 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 36; color: var(--blue); text-wrap: balance; }
html:lang(zh-Hans) .card h3 { font: 700 var(--step-1)/1.35 var(--f-zh); }
.card p { margin: 0; font-size: var(--step--1); line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.card .art { height: 56px; display: flex; align-items: end; }
.card .art:empty { display: none; }
.card .art svg { height: 100%; width: auto; overflow: visible; --rw: 10; --rwl: 7; }
.ground { position: relative; height: 150px; margin-top: 10px; }
.ground .line { position: absolute; left: 0; right: 0; bottom: 34px; height: 2px; background: repeating-linear-gradient(90deg, var(--blue) 0 10px, transparent 10px 18px); opacity: .35; }
.ground .dots { position: absolute; inset: 0; will-change: transform; }
.ground .dot { position: absolute; bottom: 28px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--red); }
.hop { position: absolute; left: 0; bottom: 20px; width: 120px; height: 85px; will-change: transform; transform-origin: 50% 80%; }
.hop svg { width: 100%; height: 100%; overflow: visible; display: block; --rw: 6; --rwl: 4.2; }
.h-hint { padding-right: var(--gutter-r); padding-left: max(var(--gutter-l), calc((100vw - 1200px) / 2 + 16px)); font: 600 12px/1.5 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

/* ---------- 1972 ---------- */
.d72 .big { font: 800 clamp(5rem, 3rem + 13vw, 13rem)/.8 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; color: var(--red); letter-spacing: -.05em; font-variant-numeric: lining-nums; }
.gift-box { position: relative; display: grid; place-items: center; min-height: 340px; }
.gift-box svg { width: min(420px, 86vw); height: auto; overflow: visible; }
.kilo { display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px 14px; margin: 22px 0 8px; }
.kilo b { font: 750 var(--step-4)/1.05 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 144; color: var(--blue); letter-spacing: -.03em; font-variant-numeric: tabular-nums lining-nums; }
.kilo > span { font-size: var(--step-1); color: var(--ink); max-width: 26ch; line-height: 1.3; }
.caveat { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: var(--milk); font-size: var(--step--1); line-height: 1.5; color: var(--ink); max-width: 62ch; }
.caveat b { color: var(--red-ink); }

/* ---------- kinds: the carousel ---------- */
.ring { position: relative; height: clamp(300px, 40vw, 440px); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.ring:active { cursor: grabbing; }
.ring { --iw: clamp(92px, 15vw, 240px); }
.ring .it { position: absolute; left: 50%; top: 44%; width: var(--iw); height: calc(var(--iw) * .4); margin-left: calc(var(--iw) * -.5); margin-top: calc(var(--iw) * -.2); will-change: transform, opacity; }
.ring .it svg { width: 100%; height: 100%; overflow: visible; display: block; }
.ring-name { text-align: center; display: grid; gap: 4px; justify-items: center; min-height: 3.6em; }
.ring-name b { font: 650 var(--step-2)/1.1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 72; color: var(--blue); }
html:lang(zh-Hans) .ring-name b { font: 400 var(--step-2)/1.2 var(--f-zh-display); letter-spacing: .04em; }
.ring-name > span { font-size: var(--step--1); color: var(--muted); }
.ring-ctl { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
.ring-ctl button { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hair); display: grid; place-items: center; color: var(--blue); }
.ring-ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); margin-top: clamp(30px, 5vh, 54px); }
.stats div { min-width: 0; padding: 18px 18px 16px; border-radius: 20px; box-shadow: inset 0 0 0 1.5px var(--hair); }
.stats b { display: block; font: 700 var(--step-3)/1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 144; color: var(--blue); letter-spacing: -.02em; font-variant-numeric: tabular-nums lining-nums; }
.stats div > span { display: block; margin-top: 8px; font-size: var(--step--1); color: var(--muted); line-height: 1.4; }

/* ---------- pop culture ---------- */
.pops { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); perspective: 900px; }
@media (max-width: 600px) { .pops { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .pop { padding: 16px 14px; } .pop .ic { width: 48px; height: 48px; } }
.pop { min-width: 0; padding: 22px 20px 20px; border-radius: 24px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--hair); display: grid; gap: 10px; align-content: start; transform-style: preserve-3d; transition: box-shadow .3s; }
@media (hover: hover) and (pointer: fine) { .pop { will-change: transform; } }
.pop:hover { box-shadow: 0 0 0 1.5px var(--blue), 0 26px 50px -34px rgba(19, 41, 92, .45); }
.pop .ic { width: 64px; height: 64px; }
.pop .ic svg { width: 100%; height: 100%; display: block; overflow: visible; --rw: 10; --rwl: 7; }
.pop .when { font: 700 13px/1 var(--f-body); letter-spacing: .1em; color: var(--red-ink); font-variant-numeric: lining-nums; }
html:lang(zh-Hans) .pop .when { font-family: var(--f-zh); letter-spacing: .04em; }
.pop h3 { margin: 0; font: 650 var(--step-1)/1.2 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 36; color: var(--blue); }
html:lang(zh-Hans) .pop h3 { font: 700 var(--step-1)/1.35 var(--f-zh); }
.pop p { margin: 0; font-size: var(--step--1); line-height: 1.55; }

/* ---------- fun facts: the jar ---------- */
.jar-box { position: relative; height: clamp(380px, 56vh, 560px); touch-action: pan-y; }
#jar { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.fact { position: relative; padding: 26px 24px 22px; border-radius: 28px; background: var(--milk); min-height: 220px; display: grid; align-content: start; gap: 12px; transform-origin: 50% 0; }
.fact .n { font: 700 13px/1 var(--f-body); letter-spacing: .14em; color: var(--red-ink); text-transform: uppercase; font-variant-numeric: tabular-nums; }
html:lang(zh-Hans) .fact .n { letter-spacing: .2em; font-family: var(--f-zh); }
.fact p { margin: 0; font: 500 var(--step-1)/1.45 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 24; color: var(--ink); text-wrap: pretty; }
html:lang(zh-Hans) .fact p { font: 500 var(--step-1)/1.7 var(--f-zh); }
.fact .ctl { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.all-facts { margin-top: 16px; }
.all-facts summary { cursor: pointer; font-weight: 600; color: var(--blue); }

 "facts": [
  {
   "en": "The “rice paper” has no rice in it. It is a starch film about 0.02\u00a0mm thick, so thin it dissolves on your tongue.",
   "de": "Im „Reispapier“ steckt gar kein Reis. Es ist ein Stärkefilm, nur rund 0,02\u00a0mm dick, der sofort auf der Zunge zergeht. Im Grunde eine Oblate.",
   "zh": "“糯米纸”里其实没有糯米。它是一层约<span class=\"nw\">0.02毫米</span>厚的淀粉膜，薄得一放进嘴里就化了。"
  },
  {
   "en": "To keep copycats away, the maker also registered look-alike names: Big Grey Rabbit (<span lang=\"zh-Hans\">大灰兔</span>), Big Black Rabbit (<span lang=\"zh-Hans\">大黑兔</span>) and Big Spotted Rabbit (<span lang=\"zh-Hans\">大花兔</span>).",
   "de": "Gegen Nachahmer ließ der Hersteller auch ähnliche Namen schützen: „Großer Grauer Hase“ (<span lang=\"zh-Hans\">大灰兔</span>), „Großer Schwarzer Hase“ (<span lang=\"zh-Hans\">大黑兔</span>) und „Großer Gefleckter Hase“ (<span lang=\"zh-Hans\">大花兔</span>).",
   "zh": "为了防止山寨，冠生园还注册了一串“近亲”商标：大灰兔、大黑兔、大花兔……"
  },
  {
   "en": "Joseph Beuys never went to China, but in 1979 he turned the wrapper into art and called it “<span lang=\"de\">Chinesischer Hasenzucker</span>”, Chinese hare sugar. Hare or rabbit? The Chinese <span lang=\"zh-Hans\">兔</span> doesn't tell the two apart.",
   "de": "Joseph Beuys war nie in China, machte 1979 aber aus dem Bonbonpapier Kunst: „Chinesischer Hasenzucker“. Hase oder Kaninchen? Das chinesische <span lang=\"zh-Hans\">兔</span> unterscheidet die beiden gar nicht.",
   "zh": "约瑟夫·博伊斯从没去过中国，却在<span class=\"nw\">1979年</span>把大白兔糖纸做成了艺术品《中国兔子糖》。德文原名里的Hase其实是野兔，不过中文一个“兔”字，本来就把家兔、野兔都包括了。"
  },
  {
   "en": "At a Beuys show in Shanghai that opened in 2018, the How Art Museum heaped free White Rabbit under that print. By June 2019, the museum said, visitors had eaten about a tonne. “I'm not eating candy,” one said, “I'm eating art.”",
   "de": "In einer Beuys-Ausstellung, die 2018 in Shanghai eröffnet wurde, häufte das How Art Museum unter diesem Druck kostenlose White Rabbits auf. Bis Juni 2019, so das Museum, hatten die Besucher rund eine\u00a0Tonne davon gegessen. „Ich esse keine Bonbons“, sagte einer von ihnen, „ich esse Kunst.“",
   "zh": "在<span class=\"nw\">2018年</span>开幕的博伊斯展上，上海昊美术馆在这件作品下堆满免费的大白兔。据美术馆介绍，到<span class=\"nw\">2019年6月</span>，观众已吃掉约一吨。有人边吃边说：“我吃的不是糖，是艺术。”"
  },
  {
   "en": "In the early years every pot of candy syrup was beaten by hand for 40\u00a0minutes.",
   "de": "In den frühen Jahren wurde jeder Topf Bonbonmasse 40\u00a0Minuten lang von Hand geschlagen.",
   "zh": "早年间，每一锅糖浆都要靠工人手工搅打<span class=\"nw\">40分钟</span>。"
  },
  {
   "en": "Fresh candy mass turns slightly yellow. The maker says a purely mechanical “pulling white” step (<span lang=\"zh-Hans\">拉白</span>) makes it white again, with no additives.",
   "de": "Frische Bonbonmasse färbt sich leicht gelblich. Laut Hersteller wird sie durch einen rein mechanischen Arbeitsschritt, das „Weißziehen“ (<span lang=\"zh-Hans\">拉白</span>), wieder weiß, ganz ohne Zusätze.",
   "zh": "刚熬好的糖坯会微微发黄。据冠生园介绍，靠一道纯物理的“拉白”工艺就能让它重新变白，不加任何添加剂。"
  },
  {
   "en": "In 2019 the factory made 27,000\u00a0tonnes. At about 5\u00a0g a candy, that is roughly 15\u00a0million White Rabbits a day.",
   "de": "2019 produzierte die Fabrik 27.000\u00a0Tonnen. Bei rund 5\u00a0g pro Bonbon sind das etwa 15\u00a0Millionen White Rabbits am Tag.",
   "zh": "<span class=\"nw\">2019年</span>大白兔产量<span class=\"nw\">2.7万吨</span>。按每颗约<span class=\"nw\">5克</span>算，相当于每天约<span class=\"nw\">1500万颗</span>。"
  },
  {
   "en": "Chinese New Year is the big season: in December 2022 and January 2023 alone, White Rabbit sold 400\u00a0million\u00a0yuan worth, about a third of the year's sales.",
   "de": "Das chinesische Neujahrsfest ist Hochsaison: Allein im Dezember 2022 und Januar 2023 setzte White Rabbit 400\u00a0Millionen\u00a0Yuan um, etwa ein Drittel des Jahresumsatzes.",
   "zh": "春节是旺季：仅<span class=\"nw\">2022年12月</span>至<span class=\"nw\">2023年1月</span>，大白兔奶糖就卖了<span class=\"nw\">4亿元</span>，约占全年销售额的三分之一。"
  },
  {
   "en": "At a 1972 banquet for the American advance team, Shanghai also gave every guest liqueur chocolates, each filled with a different Chinese spirit, Moutai among them.",
   "de": "Beim Bankett für das amerikanische Vorausteam 1972 bekam außerdem jeder Gast Likörpralinen, jede mit einem anderen chinesischen Schnaps gefüllt, darunter Moutai.",
   "zh": "<span class=\"nw\">1972年</span>，在招待美方先遣组的宴会上，上海还送给每位美国客人一份上海益民食品一厂的酒心巧克力，每颗里装着不同的中国名酒：茅台、竹叶青、五粮液……"
  },
  {
   "en": "The wrapper isn't one trademark but eight: the maker registered its parts separately.",
   "de": "Das Bonbonpapier ist nicht eine Marke, sondern gleich acht: Der Hersteller hat seine Bestandteile einzeln eintragen lassen.",
   "zh": "一张糖纸，拆成了<span class=\"nw\">8件</span>商标分别注册。"
  },
  {
   "en": "For the 2023 Year of the Rabbit, Shanghai's Oriental Pearl Tower glowed in White Rabbit red, white and blue for a month.",
   "de": "Zum Jahr des Hasen 2023 leuchtete Shanghais Oriental Pearl Tower einen Monat lang in White-Rabbit-Rot, -Weiß und -Blau.",
   "zh": "<span class=\"nw\">2023兔年</span>春节，东方明珠塔亮起大白兔经典的红、白、蓝，持续了约一个月。"
  },
  {
   "en": "The rabbit has changed poses. The 1983 trademark shows it sitting, later registrations show it running, and in 2001, the brand says, a crease-proof wrapper made the once-flat rabbit “stand up”.",
   "de": "Der Hase hat mehrmals die Pose gewechselt: Die Marke von 1983 zeigt ihn sitzend, spätere Eintragungen zeigen ihn laufend, und 2001 ließ laut Hersteller ein knitterfestes Bonbonpapier den ruhenden Hasen „aufstehen“.",
   "zh": "这只兔子换过好几种姿势：<span class=\"nw\">1983年</span>注册的商标是坐着的，后来的商标是奔跑的；据光明食品介绍，<span class=\"nw\">2001年</span>改用不易皱折的包装材料，让原先静态的兔子“站了起来”。"
  },
  {
   "en": "“Seven White Rabbits make a glass of milk” may not have started as an advert. A factory veteran said ordinary people came up with it in the lean years around 1960, when milk was scarce and they dissolved the candies in hot water. It later became a famous slogan, and the maker still repeats it.",
   "de": "„Sieben White Rabbits sind so gut wie ein Glas Milch“ begann wohl nicht als Werbung. Ein langjähriger Mitarbeiter der Fabrik erzählte, die Leute hätten sich den Spruch in den Mangeljahren um 1960 selbst ausgedacht, als Milch knapp war und sie die Bonbons in heißem Wasser auflösten. Später wurde er zum berühmten Werbespruch, und der Hersteller zitiert ihn bis heute.",
   "zh": "“七粒大白兔奶糖等于一杯牛奶”最初可能并不是厂家的广告语。据厂里的老师傅回忆，这是三年困难时期牛奶紧缺，老百姓用热水泡奶糖，自己总结出来的说法；后来它成了家喻户晓的广告语，厂家至今仍在引用。"
  },
  {
   "en": "White Rabbit once had a little sister: Big Red Rabbit (<span lang=\"zh-Hans\">大红兔</span>), a cocoa candy in red packaging. It never caught on and was dropped.",
   "de": "White Rabbit hatte einmal eine kleine Schwester: „Großer Roter Hase“ (<span lang=\"zh-Hans\">大红兔</span>), ein Kakaobonbon in roter Verpackung. Es kam nie richtig an und verschwand wieder.",
   "zh": "大白兔还有过一个“妹妹”：红色包装、可可口味的大红兔。它一直不太受欢迎，后来就停产了。"
  },
  {
   "en": "Premier Zhou\u00a0Enlai is said to have kept White Rabbits on his desk for late nights of work. In 2008 the Associated Press called them his favourite late-night snack.",
   "de": "Premier Zhou\u00a0Enlai soll für lange Arbeitsnächte White Rabbits auf dem Schreibtisch gehabt haben. Die Associated Press nannte sie 2008 seinen liebsten Mitternachtssnack.",
   "zh": "据说周恩来总理的办公桌上常备大白兔，熬夜工作时会吃上几颗。<span class=\"nw\">2008年</span>，美联社还称它是周总理最爱的夜宵。"
  }

/* ======================================================================
   WHAT IT IS: seven candies make one glass of milk (the old slogan).
   ====================================================================== */
const glass = (() => {
  const box = $("#glassBox"), tray = $("#tray"), milk = $("#milk"), line = $("#milkLine"), sunk = $("#sunk"), read = $("#glassRead"), svg = $("#glassBox svg.glass");
  const Y0 = 284, Y1 = 64;    // milk level for 0 and 7 candies

  const ticks = $("#ticks");

  const candySvg = band => `<svg viewBox="0 0 170 68" aria-hidden="true" style="--band:${band}"><use href="#candy-sym"/></svg>`;
  function fillTray() {
    tray.innerHTML = "";

      const b = document.createElement("button");
      b.type = "button"; b.id = "candy-" + i; b.innerHTML = candySvg(C.red);
      b.setAttribute("aria-label", t("glass.drop", { i: i + 1 }));
      b.addEventListener("click", () => drop(b));
      tray.appendChild(b);
    }
  }
  function label() {

  }
  function drop(btn) {
    if (btn.disabled || n >= 7) return;

    if (document.activeElement === btn) { const next = $$("#tray button").find(b => b !== btn && !b.disabled); (next || $("#pourReset")).focus(); }
    btn.disabled = true;
    const g0 = gen;
    const from = btn.getBoundingClientRect(), to = svg.getBoundingClientRect();
    const fl = document.createElement("div"); fl.className = "flyer"; fl.innerHTML = candySvg(C.red);
    document.body.appendChild(fl);
    const x0 = from.left, y0 = from.top, x1 = to.left + to.width * .5 - 32, y1 = to.top + to.height * ((lerp(Y0, Y1, n / 7) - 10) / 300);
    const T = REDUCE ? .01 : .62, peak = Math.min(y0, y1) - 90;
    const t0 = performance.now();
    const step = now => {
      if (g0 !== gen) { fl.remove(); return; }
      const k = clamp((now - t0) / 1000 / T, 0, 1);
      const x = lerp(x0, x1, k), y = (1 - k) * (1 - k) * y0 + 2 * (1 - k) * k * peak + k * k * y1;
      fl.style.transform = `translate3d(${x}px,${y}px,0) rotate(${k * 300}deg) scale(${lerp(1, .7, k)})`;
      if (k < 1) requestAnimationFrame(step);
      else { fl.remove(); if (g0 !== gen || n >= 7) return; n++; vel += REDUCE ? 0 : 2.4; slosh = REDUCE ? 0 : 1; rest = false; sinkOne(); label(); }
    };
    requestAnimationFrame(step);
  }
  function sinkOne() {
    const x = 70 + (n * 37) % 70, y = 268 - (n % 3) * 9;
    sunk.insertAdjacentHTML("beforeend", `<g transform="translate(${x} ${y}) rotate(${(n * 47) % 60 - 30}) scale(.32)" opacity=".55"><use href="#candy-sym" x="-85" y="-34" style="--band:${C.red}"/></g>`);
  }
  $("#pourAll").addEventListener("click", () => { timers = $$("#tray button").filter(b => !b.disabled).map((b, i) => setTimeout(() => drop(b), i * (REDUCE ? 0 : 120))); });
  $("#pourReset").addEventListener("click", () => {
    // cancel candies still in the air (or waiting to be thrown) before emptying
    gen++; timers.forEach(clearTimeout); timers = []; $$(".flyer").forEach(f => f.remove());
    n = 0; sunk.innerHTML = ""; fillTray(); label(); slosh = REDUCE ? 0 : 1; rest = false;
  });

  fillTray();

    update(dt, now) {

      const target = n / 7;

      }

      line.setAttribute("d", l);
    },
    measure() {},
  });
})();

/* ======================================================================
   HISTORY: a horizontal track pinned while you scroll; the rabbit hops
   along the ground from year to year.
   ====================================================================== */
const history = (() => {
  const pin = $("#hPin"), track = $("#track"), dotsBox = $("#dots"), hop = $("#hop"), body = $("#hopBody");
  let top = 0, travel = 1, x = -1, p = 0, dots = [], speed = 0, lastRx = 0, dir = 1, lastK = -1;
  // the hopping rabbit morphs between its crouch (feet on the ground) and its stretch (mid-air)
  const RB_ATTR = { back: 'class="k-back" fill="#fff" stroke="#1D4EA6"', main: 'class="k-main" fill="#fff" stroke="#1D4EA6"', line: 'class="k-line" fill="none" stroke="#1D4EA6"', pink: 'fill="#F6B4C3"', red: 'fill="#E1252B"', white: 'fill="#fff"' };
  body.innerHTML = RABBIT.gather.map(l => `<path ${RB_ATTR[l.k]} d="${l.d}"/>`).join("");
  const hopPaths = [...body.children], morph = rabbitMorph(RABBIT.gather, RABBIT.stretch);
  function pose(k) {
    k = Math.round(k * 100) / 100;
    if (k === lastK) return;
    lastK = k;
    const ds = morph(k);
    for (let i = 0; i < hopPaths.length; i++) hopPaths[i].setAttribute("d", ds[i]);
  }
  const yr = v => typeof v === "string" ? v : pick(v);
  function render() {
    track.innerHTML = DATA.timeline.map(it => `<article class="card"><div class="art" aria-hidden="true">${ICONS[it.icon] || ""}</div><div class="yr">${yr(it.year)}</div><h3>${pick(it.t)}</h3><p>${pick(it.d)}</p></article>`).join("");
    dotsBox.innerHTML = DATA.timeline.map(() => '<span class="dot"></span>').join("");
    measure();
  }
  function measure() {
    // the track stops when the last card rests at the left gutter (phones) or 30% in (wide screens)
    const cards = $$(".card", track), last = cards[cards.length - 1], gl = parseFloat(getComputedStyle(track).paddingLeft) || 16;
    travel = last ? Math.max(0, Math.min(last.offsetLeft + last.offsetWidth + VW * .3 - VW, last.offsetLeft - gl)) : 0;
    pin.style.height = (travel + VH) + "px";
    top = docTop(pin);
    dots = cards.map(c => c.offsetLeft + 36);
    $$(".dot", dotsBox).forEach((d, i) => { d.style.left = dots[i] + "px"; });
    x = -1;
  }
  langHooks.push(render);
  return comp(pin, {
    measure, render,
    update(dt) {
      const raw = clamp((SY - top) / Math.max(1, travel), 0, 1);
      p = REDUCE || Math.abs(raw - p) < 1e-4 ? raw : damp(p, raw, 9, dt);
      const nx = Math.round(p * travel * 2) / 2;
      if (nx === x && speed < 1e-3) return;
      const moved = nx - x; x = nx;
      track.style.transform = dotsBox.style.transform = `translate3d(${-x}px,0,0)`;
      // the rabbit sits at 30% of the screen and hops along as the years pass under it:
      // two hops per card, feet down on every year dot

      const v = (rx - lastRx) / Math.max(dt, 1e-3); lastRx = rx;

/* ======================================================================

const ring = (() => {

  // it turns by itself until someone touches it; only then are flavour changes announced

  function render() {
    el.innerHTML = DATA.kinds.map((k, i) => `<div class="it" data-i="${i}" aria-hidden="true"><svg viewBox="0 0 170 68" style="--band:${k.band};--end:${k.end || "#fff"}"><use href="#candy-sym"/></svg></div>`).join("")
      + `<ul class="sr">${DATA.kinds.map(k => `<li>${pick(k.name)}${pick(k.note) ? " (" + pick(k.note) + ")" : ""}</li>`).join("")}</ul>`;
    items = $$(".it", el);

  };

  const turn = d => { auto = false; spoken = true; target = (Math.round((target != null ? target : rot) / step()) + d) * step(); };
  $("#ringPrev").addEventListener("click", () => turn(1));
  $("#ringNext").addEventListener("click", () => turn(-1));
  el.closest("section").addEventListener("focusin", () => { auto = false; });
  langHooks.push(() => { front = -1; });
  return comp(el, {
    render, measure,
    update(dt, now) {
      if (!items.length) return;
      if (!drag) {
        if (target != null) { rot = damp(rot, target, 7, dt); if (Math.abs(rot - target) < 1e-4) { rot = target; target = null; } vel = 0; }

      items.forEach((it, i) => {

        const s = lerp(.4, smax, Math.pow((z + 1) / 2, fall));
        const y = z * R * tilt + (REDUCE ? 0 : Math.sin(now * 1.3 + i) * 4);
        it.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${(Math.sin(a) * -14).toFixed(1)}deg) scale(${s.toFixed(3)})`;
        it.style.opacity = lerp(.18, 1, Math.pow((z + 1) / 2, 1.6)).toFixed(2);
        const zi = Math.round((z + 1) * 7);
        if (it._zi !== zi) { it._zi = zi; it.style.zIndex = zi; }
        if (z > bz) { bz = z; best = i; }
      });
      if (best !== front) {
        front = best;
        const k = DATA.kinds[best];
        name.textContent = pick(k.name);
        note.textContent = pick(k.note) || "";
        if (spoken) live.textContent = name.textContent + (note.textContent ? ", " + note.textContent : "");
      }
    },
  });
})();

/* ======================================================================
   POP CULTURE: cards that tilt toward the pointer.
   ====================================================================== */
const pops = (() => {
  const el = $("#pops");
  function render() {
    el.innerHTML = DATA.pops.map(p => `<article class="pop"><div class="ic" aria-hidden="true">${ICONS[p.icon] || ""}</div><span class="when">${typeof p.when === "string" ? p.when : pick(p.when)}</span><h3>${pick(p.t)}</h3><p>${pick(p.d)}</p></article>`).join("");
    for (const c of $$(".pop", el)) {
      c.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const r = c.getBoundingClientRect(); c._tx = ((e.clientY - r.top) / r.height - .5) * -8; c._ty = ((e.clientX - r.left) / r.width - .5) * 10; });
      c.addEventListener("pointerleave", () => { c._tx = 0; c._ty = 0; });
      c._x = c._y = c._tx = c._ty = 0;
    }
  }
  langHooks.push(render);
  return comp(el, {
    render, measure() {},
    update(dt) {
      for (const c of el.children) {
        c._x = damp(c._x, c._tx, 10, dt); c._y = damp(c._y, c._ty, 10, dt);
        c.style.transform = Math.abs(c._x) + Math.abs(c._y) > .01 ? `rotateX(${c._x.toFixed(2)}deg) rotateY(${c._y.toFixed(2)}deg)` : "";
      }
    },
  });
})();

/* ======================================================================
   FUN FACTS: a glass jar of candies with a little physics. Each candy is
   a capsule (two points kept a fixed distance apart); tap one to pop it
   out and read a fact.
   ====================================================================== */
const jar = (() => {
  const box = $("#jarBox"), cv = $("#jar"), g = cv.getContext("2d");
  const factN = $("#factN"), factText = $("#factText"), card = $("#factCard");
  const BANDS = [C.red, C.blue, "#E8A23A", "#3E8E5E", "#8A4B2A"];
  let W = 0, H = 0, dpr = 1, J = null, candies = [], fi = 0, flip = 0;
  let acc = 0, still = 0, asleep = false, dirty = true, sprites = [], back = null, front = null;
  const N = 30, STEP = 1 / 120, snap = new Float64Array(N * 4);
  function geom() {

  }
  function makeCandy(i, seed) {
    const r = J.cr, len = r * 2.6;
    const x = lerp(J.x0 + r * 2, J.x1 - r * 2, ((i * 0.618034 + seed) % 1));
    const y = J.y0 - r * 2 - (i % 7) * r * 2.4 - Math.floor(i / 7) * r * 3;
    const a = (i * 1.7) % Math.PI;
    const c = { r, len, bi: i % BANDS.length, pop: 0 };
    c.p = [[x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2], [x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2]];
    c.o = c.p.map(q => q.slice());
    return c;
  }
  function reset() { candies = []; for (let i = 0; i < N; i++) candies.push(makeCandy(i, .13)); for (let s = 0; s < 480; s++) sim(STEP); wake(); }
  function wake() { asleep = false; still = 0; }
  // stacked capsules jitter by a fraction of a pixel forever, so "at rest" means:
  // no point has moved more than half a pixel over the last 30 steps
  function settled() {
    let m = 0;
    for (let i = 0; i < candies.length; i++) for (let k = 0; k < 2; k++) {
      const q = candies[i].p[k], j = i * 4 + k * 2, dx = q[0] - snap[j], dy = q[1] - snap[j + 1];
      m = Math.max(m, dx * dx + dy * dy); snap[j] = q[0]; snap[j + 1] = q[1];
    }
    return m < .25;
  }
  const layer = () => { const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height; const q = c.getContext("2d"); q.setTransform(dpr, 0, 0, dpr, 0, 0); return [c, q]; };
  function measure() {
    dpr = DPR(); W = box.clientWidth; H = box.clientHeight;
    const cw = Math.round(W * dpr), ch = Math.round(H * dpr);
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    const nj = geom();
    if (!J || Math.abs(nj.cr - J.cr) > .5 || Math.abs(nj.x0 - J.x0) > 1) { J = nj; reset(); } else J = nj;
    buildLayers();
  }
  /* -------- the static parts are painted once per size: candy sprites, the jar's back, its glass front and label */
  function buildLayers() {
    const R = J.cr, L = R * 2.6 + R * .4, sw = L + R * 1.8 + 4, sh = R * 2 + 4;
    sprites = BANDS.map(band => {
      const c = document.createElement("canvas"); c.width = Math.ceil(sw * dpr); c.height = Math.ceil(sh * dpr);
      const q = c.getContext("2d"); q.setTransform(dpr, 0, 0, dpr, c.width / 2, c.height / 2);
      // twisted ends
      q.fillStyle = "#fff"; q.strokeStyle = C.blue; q.lineWidth = 1.4; q.lineJoin = "round";
      for (const s of [-1, 1]) {
        q.beginPath(); q.moveTo(s * L / 2, -R * .55); q.lineTo(s * (L / 2 + R * .4), -R * .1); q.lineTo(s * (L / 2 + R * .8), -R * .85); q.lineTo(s * (L / 2 + R * .7), 0); q.lineTo(s * (L / 2 + R * .8), R * .85); q.lineTo(s * (L / 2 + R * .4), R * .1); q.lineTo(s * L / 2, R * .55); q.closePath(); q.fill(); q.stroke();
      }
      q.beginPath(); q.roundRect ? q.roundRect(-L / 2, -R, L, R * 2, R * .8) : q.rect(-L / 2, -R, L, R * 2);
      q.fillStyle = "#fff"; q.fill();
      q.save(); q.clip(); q.fillStyle = band; q.fillRect(-L / 2, -R * .28, L, R * .56); q.restore();
      const shd = q.createLinearGradient(0, -R, 0, R); shd.addColorStop(0, "rgba(19,41,92,.18)"); shd.addColorStop(.35, "rgba(255,255,255,0)"); shd.addColorStop(1, "rgba(19,41,92,.22)");
      q.fillStyle = shd; q.fill();
      q.strokeStyle = C.blue; q.lineWidth = 1.6; q.stroke();
      return { c, w: c.width / dpr, h: c.height / dpr };
    });
    const { x0, x1, y0, y1, r } = J;
    let q;
    [back, q] = layer();
    q.fillStyle = "rgba(29,78,166,.05)";
    q.beginPath(); q.moveTo(x0, y0 + 10); q.lineTo(x0, y1 - r); q.quadraticCurveTo(x0, y1, x0 + r, y1); q.lineTo(x1 - r, y1); q.quadraticCurveTo(x1, y1, x1, y1 - r); q.lineTo(x1, y0 + 10); q.closePath(); q.fill();
    [front, q] = layer();
    // glass front: outline and highlights
    q.lineWidth = 3.5; q.strokeStyle = C.blue; q.lineJoin = "round"; q.lineCap = "round";
    q.beginPath(); q.moveTo(x0 - 8, y0); q.quadraticCurveTo(x0, y0, x0, y0 + 14); q.lineTo(x0, y1 - r); q.quadraticCurveTo(x0, y1, x0 + r, y1); q.lineTo(x1 - r, y1); q.quadraticCurveTo(x1, y1, x1, y1 - r); q.lineTo(x1, y0 + 14); q.quadraticCurveTo(x1, y0, x1 + 8, y0); q.stroke();
    q.strokeStyle = "rgba(255,255,255,.85)"; q.lineWidth = 8;
    q.beginPath(); q.moveTo(x0 + 16, y0 + 40); q.lineTo(x0 + 16, y1 - r - 10); q.stroke();
    q.strokeStyle = "rgba(255,255,255,.6)"; q.lineWidth = 4;
    q.beginPath(); q.moveTo(x0 + 30, y0 + 40); q.lineTo(x0 + 30, y0 + 120); q.stroke();
    // the lid, set aside on its rim
    const lw = (x1 - x0) * .86, lx = (x0 + x1) / 2 + (x1 - x0) * .1, ly = y0 - 34;
    q.fillStyle = "rgba(19,41,92,.07)"; q.beginPath(); q.ellipse((x0 + x1) / 2, y0 + 4, (x1 - x0) * .5, 6, 0, 0, Math.PI * 2); q.fill();
    q.save(); q.translate(lx, ly); q.rotate(.2);
    q.fillStyle = C.red; q.beginPath(); q.roundRect ? q.roundRect(-lw / 2, -14, lw, 24, 8) : q.rect(-lw / 2, -14, lw, 24); q.fill();
    q.fillStyle = "rgba(255,255,255,.25)"; q.fillRect(-lw / 2 + 10, -10, lw - 20, 4);
    q.fillStyle = C.red; q.beginPath(); q.arc(0, -18, 10, 0, Math.PI * 2); q.fill();
    q.restore();
    // a paper label with the rabbit
    const lyy = lerp(y0, y1, .58), lw2 = (x1 - x0) * .5;
    q.fillStyle = "rgba(255,255,255,.92)"; q.strokeStyle = "rgba(29,78,166,.5)"; q.lineWidth = 1.5;
    q.beginPath(); q.roundRect ? q.roundRect((x0 + x1) / 2 - lw2 / 2, lyy - 26, lw2, 52, 10) : q.rect((x0 + x1) / 2 - lw2 / 2, lyy - 26, lw2, 52); q.fill(); q.stroke();
    drawRabbit(q, (x0 + x1) / 2 - lw2 * .22, lyy + 2, .2, C.blue, 9);
    q.fillStyle = C.blue; q.font = '400 22px "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif'; q.textAlign = "left"; q.textBaseline = "middle";
    q.fillText("大白兔", (x0 + x1) / 2 - lw2 * .02, lyy + 1);
    dirty = true;
  }
  // the label font may only arrive with the Chinese text; repaint the label when it does
  if (document.fonts && document.fonts.load) document.fonts.load('400 22px "ZCOOL QingKe HuangYou"', "大白兔").then(() => { if (J) buildLayers(); }, () => {});
  function wall(q, r) {
    // keep a point inside the jar: straight sides, rounded bottom corners, open top
    const x0 = J.x0, x1 = J.x1, y1 = J.y1, cr = J.r;
    if (q[1] > y1 - cr) {
      const cx = q[0] < (x0 + x1) / 2 ? x0 + cr : x1 - cr;
      if (cx < (x0 + x1) / 2 ? q[0] < cx : q[0] > cx) {
        const dx = q[0] - cx, dy = q[1] - (y1 - cr), d = Math.sqrt(dx * dx + dy * dy), lim = cr - r;
        if (d > lim) { q[0] = cx + dx / d * lim; q[1] = (y1 - cr) + dy / d * lim; }
      }
    }
    if (q[0] < x0 + r) q[0] = x0 + r;
    if (q[0] > x1 - r) q[0] = x1 - r;
    if (q[1] > y1 - r) q[1] = y1 - r;
  }
  /* -------- verlet capsules; the inner loop is scalar and allocation-free */
  function sim(dt) {
    const gdd = 2200 * dt * dt, n = candies.length;
    for (let i = 0; i < n; i++) {
      const c = candies[i];
      for (let k = 0; k < 2; k++) {
        const q = c.p[k], o = c.o[k];
        const vx = (q[0] - o[0]) * .995, vy = (q[1] - o[1]) * .995;
        o[0] = q[0]; o[1] = q[1];
        q[0] += vx; q[1] += vy + gdd;
      }
    }
    for (let it = 0; it < 4; it++) {
      for (let i = 0; i < n; i++) {
        // keep the capsule's length
        const c = candies[i], a = c.p[0], b = c.p[1], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.sqrt(dx * dx + dy * dy) || 1, k = (d - c.len) / d / 2;
        a[0] += dx * k; a[1] += dy * k; b[0] -= dx * k; b[1] -= dy * k;
      }
      for (let i = 0; i < n; i++) {
        const A = candies[i]; if (A.pop) continue;
        const a0 = A.p[0], a1 = A.p[1];
        for (let j = i + 1; j < n; j++) {
          const B = candies[j]; if (B.pop) continue;
          const b0 = B.p[0], b1 = B.p[1];
          const mx = (a0[0] + a1[0] - b0[0] - b1[0]) * .5, my = (a0[1] + a1[1] - b0[1] - b1[1]) * .5, reach = (A.len + B.len) * .5 + A.r + B.r;
          if (mx * mx + my * my > reach * reach) continue;
          // closest points between the two segments (parameters s, t)
          const d1x = a1[0] - a0[0], d1y = a1[1] - a0[1], d2x = b1[0] - b0[0], d2y = b1[1] - b0[1], rx = a0[0] - b0[0], ry = a0[1] - b0[1];
          const aa = d1x * d1x + d1y * d1y, e = d2x * d2x + d2y * d2y, f = d2x * rx + d2y * ry, c = d1x * rx + d1y * ry, bb = d1x * d2x + d1y * d2y, den = aa * e - bb * bb;
          let s = den > 1e-9 ? clamp((bb * f - c * e) / den, 0, 1) : 0, t = (bb * s + f) / e;
          if (t < 0) { t = 0; s = clamp(-c / aa, 0, 1); } else if (t > 1) { t = 1; s = clamp((bb - c) / aa, 0, 1); }
          const dx = b0[0] + d2x * t - a0[0] - d1x * s, dy = b0[1] + d2y * t - a0[1] - d1y * s, dd = dx * dx + dy * dy, min = A.r + B.r;
          if (dd >= min * min || dd < 1e-12) continue;
          const d = Math.sqrt(dd), push = (min - d) / d * .5, px = dx * push, py = dy * push;
          a0[0] -= px * (1 - s); a0[1] -= py * (1 - s); a1[0] -= px * s; a1[1] -= py * s;
          b0[0] += px * (1 - t); b0[1] += py * (1 - t); b1[0] += px * t; b1[1] += py * t;
        }
      }
      for (let i = 0; i < n; i++) { const c = candies[i]; if (!c.pop) { wall(c.p[0], c.r); wall(c.p[1], c.r); } }
    }
  }
  function draw() {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(back, 0, 0);
    for (const c of candies) {
      const a = c.p[0], b = c.p[1], cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, dx = b[0] - a[0], dy = b[1] - a[1], d = Math.sqrt(dx * dx + dy * dy) || 1;
      const co = dx / d * dpr, si = dy / d * dpr, sp = sprites[c.bi];
      g.globalAlpha = c.pop ? 1 - sstep(.5, 1, c.pop) : 1;
      g.setTransform(co, si, -si, co, cx * dpr, cy * dpr);
      g.drawImage(sp.c, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
    }
    g.globalAlpha = 1; g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(front, 0, 0);
  }
  function showFact(i, animate) {
    const F = DATA.facts;
    if (!F.length) return;
    fi = ((i % F.length) + F.length) % F.length;
    factN.textContent = t("facts.n", { i: fi + 1, n: F.length });
    factText.innerHTML = pick(F[fi]);
    if (animate && !REDUCE) flip = 1;
  }
  function popCandy(c) {
    c.pop = .001;
    for (let k = 0; k < 2; k++) { const q = c.p[k], o = c.o[k]; o[0] = q[0] + (Math.random() - .5) * 6; o[1] = q[1] + 26; }
    wake();
    showFact(fi + 1, true);
  }
  // "click", not "pointerdown": a finger that lands here to scroll the page must not pop a candy
  cv.addEventListener("click", e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9;
    for (const c of candies) {
      if (c.pop) continue;
      const [a, b] = c.p, dx = b[0] - a[0], dy = b[1] - a[1];

    else { for (const c of candies) for (const k of [0, 1]) { c.o[k][0] -= (Math.random() - .5) * 4; c.o[k][1] += 5; } wake(); }
  });
  $("#factNext").addEventListener("click", () => { const live = candies.filter(c => !c.pop); if (live.length) popCandy(live.reduce((a, c) => (c.p[0][1] < a.p[0][1] ? c : a))); else showFact(fi + 1, true); });
  function renderList() { $("#factList").innerHTML = DATA.facts.map(f => `<li>${pick(f)}</li>`).join(""); showFact(fi, false); }
  langHooks.push(renderList);
  return comp(box, {
    measure, renderList,
    update(dt, now) {
      if (!J) return;
      let popping = false;
      for (const c of candies) if (c.pop) {
        popping = true;
        c.pop += dt / 1.1;
        if (c.pop >= 1) { const i = candies.indexOf(c); candies[i] = makeCandy(i, (now * .37) % 1); candies[i].p.forEach(q => q[1] = J.y0 - J.cr * 3); candies[i].o = candies[i].p.map(q => q.slice()); }
      }
      if (!asleep || popping) {
        // a fixed 120 Hz step, so the candies fall the same way on 60, 90, 120 and 144 Hz screens
        acc = Math.min(acc + dt, 4 * STEP);

      }

})();

/* ---------------------------------------------------------------- counters: roll up when first seen (they rest at their final value) */
const counted = new WeakSet();
const cio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting || counted.has(e.target) || REDUCE) return;
  counted.add(e.target);
  const lang0 = LANG;   // a language switch mid-count must not write the old language back
  const el = e.target, txt = el.textContent, m = txt.match(/\d[\d.,\u202f\u00a0 ]*\d|\d/);
  if (!m) return;
  const raw = m[0], num = parseInt(raw.replace(/\D/g, ""), 10);
  if (!isFinite(num) || num < 10) return;
  const grouped = /\D/.test(raw), sep = grouped ? raw.match(/\D/)[0] : "";
  const fmt = v => { const s = String(Math.round(v)); return grouped ? s.replace(/\B(?=(\d{3})+(?!\d))/g, sep) : s; };
  const t0 = performance.now(), T = 1100;
  const step = now => { if (LANG !== lang0) return; const k = clamp((now - t0) / T, 0, 1), e2 = 1 - Math.pow(1 - k, 3); el.textContent = txt.replace(raw, fmt(num * e2)); if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
  requestAnimationFrame(step);
}), { threshold: .6 });

/* ---------------------------------------------------------------- static sections */
function renderStatic() {
  $("#facts3").innerHTML = DATA.facts3.map(f => `<div><b>${pick(f.v)}</b><span>${pick(f.l)}</span></div>`).join("");
  $("#stats").innerHTML = DATA.stats.map(f => `<div><b${f.count ? " data-count" : ""}>${pick(f.v)}</b><span>${pick(f.l)}</span></div>`).join("");
  $("#sources").innerHTML = DATA.sources.map(gp => `<div><h3>${pick(gp.h)}</h3><ul>${gp.items.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener"${typeof s.title === "string" ? ' lang="en"' : ""}>${typeof s.title === "string" ? s.title : pick(s.title)}</a></li>`).join("")}</ul></div>`).join("");
  $$("[data-count]").forEach(el => cio.observe(el));
}
langHooks.push(renderStatic);

/* ---------------------------------------------------------------- start */
const ICONS = window.WR_ICONS || {};
async function start() {
  setLang(detectLang(), false);
  history.render(); ring.render(); pops.render(); jar.renderList();
  measureAll();
  try { await Promise.all(['400 150px "ZCOOL QingKe HuangYou"', "800 76px Fraunces", "600 34px Figtree"].map(f => document.fonts.load(f))); } catch (e) {}
  hero.init();
  measureAll();
  requestAnimationFrame(frame);
}
start();
})();
