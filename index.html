<title>White Rabbit Candy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="大白兔奶糖, the White Rabbit creamy candy from Shanghai: what it is, its history since 1943, the 1972 diplomatic gift, its kinds and its place in pop culture, in English, German and Chinese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* Layout: the page is the candy's wrapper unrolled — white paper printed in wrapper blue with red,
   chapters laid out like panels of the print, the candy and the rabbit carrying all the motion.
   One look by design (the wrapper is white), so there is no dark palette. */
:root {
  --paper: #FFFFFF;          /* wrapper paper */
  --milk: #FBF6E9;           /* the candy */
  --milk-deep: #EFE2C4;
  --blue: #1D4EA6;           /* wrapper print */
  --ink: #13295C;            /* text: the print's darkest blue */
  --red: #E1252B;            /* wrapper red, used sparingly */
  --pink: #F6B4C3;           /* inside the rabbit's ears */
  --muted: #56617C;
  --hair: rgba(29, 78, 166, .14);
  --wash: rgba(29, 78, 166, .05);

  --f-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: "Figtree", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-zh-display: "ZCOOL QingKe HuangYou", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  --step--1: clamp(.82rem, .78rem + .2vw, .92rem);
  --step-0: clamp(1rem, .95rem + .25vw, 1.12rem);
  --step-1: clamp(1.2rem, 1.08rem + .6vw, 1.5rem);
  --step-2: clamp(1.55rem, 1.3rem + 1.3vw, 2.25rem);
  --step-3: clamp(2.1rem, 1.6rem + 2.6vw, 3.6rem);
  --step-4: clamp(3rem, 2rem + 5.4vw, 6.4rem);

  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--step-0)/1.6 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html:lang(zh-Hans) body { font-family: var(--f-zh); line-height: 1.75; }
html:lang(de) body { hyphens: auto; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--red); outline-offset: 3px; border-radius: 8px; }
a { color: var(--blue); text-underline-offset: .18em; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.bar { position: fixed; z-index: 30; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
.bar-in { display: flex; align-items: center; gap: 12px; height: 60px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.bar-in > * { pointer-events: auto; }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 6px 14px 6px 8px; box-shadow: 0 0 0 1px var(--hair); }
.mark svg { width: 38px; height: 27px; display: block; }
.mark b { font: 400 21px/1 var(--f-zh-display); letter-spacing: .04em; color: var(--blue); }
.bar .sp { flex: 1; }
.fps { font: 600 12px/1 var(--f-body); letter-spacing: .06em; color: var(--muted); background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 9px 12px; box-shadow: 0 0 0 1px var(--hair); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.fps i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.langs { display: flex; background: rgba(255, 255, 255, .88); border-radius: 999px; padding: 4px; box-shadow: 0 0 0 1px var(--hair); position: relative; }
.langs button { position: relative; z-index: 1; padding: 7px 13px; border-radius: 999px; font: 600 13px/1 var(--f-body); letter-spacing: .04em; color: var(--muted); transition: color .25s; }
.langs button[aria-pressed="true"] { color: #fff; }
.langs button:lang(zh) { font-family: var(--f-zh); letter-spacing: 0; }
.langs .pill { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: 10px; border-radius: 999px; background: var(--blue); transition: transform .45s cubic-bezier(.3, 1.4, .5, 1), width .45s cubic-bezier(.3, 1.4, .5, 1); }
.progress { position: fixed; z-index: 31; left: 0; top: 0; height: 3px; width: 100%; background: var(--red); transform-origin: 0 50%; transform: scaleX(0); }
@media (max-width: 520px) { .fps { display: none; } .mark b { font-size: 19px; } .langs button { padding: 7px 10px; } }

/* ---------- hero: the candy unwraps as you scroll ---------- */
.hero { position: relative; height: 270vh; height: 270svh; }
.hero-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; }
#candy { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-copy { position: absolute; z-index: 2; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 84px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.hero-copy .in { max-width: 560px; }
.eyebrow { margin: 0; font: 600 var(--step--1)/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
html:lang(zh-Hans) .eyebrow { letter-spacing: .3em; font-family: var(--f-zh); }
.hero h1 { margin: 14px 0 0; display: grid; gap: 4px; line-height: .9; }
.hero h1 .zh { font: 400 clamp(4.2rem, 3rem + 9vw, 9.5rem)/1 var(--f-zh-display); color: var(--blue); letter-spacing: .02em; display: flex; }
.hero h1 .zh span { display: inline-block; will-change: transform; }
.hero h1 .lat { font: 700 var(--step-3)/1 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; letter-spacing: -.02em; color: var(--ink); }
.hero h1 .lat em { font-style: italic; font-weight: 400; color: var(--red); }
.lede { margin: 18px 0 0; max-width: 34ch; font-size: var(--step-1); line-height: 1.45; color: var(--ink); text-wrap: pretty; }
html:lang(zh-Hans) .lede { max-width: 22em; }
.steps { position: absolute; z-index: 2; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); max-width: 1440px; margin-inline: auto; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 640px; }
.steps li { min-width: 0; display: grid; gap: 8px; font: 500 var(--step--1)/1.35 var(--f-body); color: var(--muted); transition: color .35s; }
.steps li .bar2 { height: 3px; border-radius: 3px; background: var(--hair); overflow: hidden; }
.steps li .bar2 i { display: block; height: 100%; background: var(--blue); transform-origin: 0 50%; transform: scaleX(0); }
.steps li b { font-weight: 700; color: var(--ink); display: block; }
.steps li.on { color: var(--ink); }
.cue { position: absolute; z-index: 2; right: var(--gutter-r); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.cue i { width: 22px; height: 34px; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--hair); position: relative; }
.cue i::after { content: ""; position: absolute; left: 50%; top: 7px; width: 4px; height: 8px; margin-left: -2px; border-radius: 2px; background: var(--blue); animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }
@media (orientation: portrait), (max-width: 860px) {
  .hero-copy { top: calc(env(safe-area-inset-top, 0px) + 76px); }
  .steps ol { max-width: none; }
  .cue { display: none; }
}

/* ---------- chapters ---------- */
.chapter { position: relative; padding-block: clamp(80px, 12vh, 150px); }
.ch-head { display: grid; gap: 10px; margin-bottom: clamp(28px, 5vh, 56px); }
.ch-head .zh { font: 400 var(--step-2)/1 var(--f-zh-display); color: var(--red); letter-spacing: .06em; }
.ch-head .zh.alt { font: 700 var(--step--1)/1.2 var(--f-body); letter-spacing: .2em; text-transform: uppercase; }
html:lang(zh-Hans) .hero h1 .lat { font: 400 var(--step-3)/1.05 var(--f-zh-display); letter-spacing: .06em; }
html:lang(zh-Hans) .hero h1 .lat em { font-style: normal; font-weight: 400; }
.ch-head h2 { margin: 0; font: 650 var(--step-4)/.95 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 144; letter-spacing: -.03em; color: var(--blue); text-wrap: balance; }
html:lang(zh-Hans) .ch-head h2 { font: 400 var(--step-4)/1.05 var(--f-zh-display); letter-spacing: .04em; }
.ch-head p { margin: 4px 0 0; max-width: 60ch; font-size: var(--step-1); line-height: 1.5; color: var(--muted); text-wrap: pretty; }
.prose p { margin: 0 0 1em; max-width: 62ch; text-wrap: pretty; }
.prose p:last-child { margin-bottom: 0; }
.prose b { color: var(--blue); font-weight: 700; }
.split { display: grid; gap: clamp(32px, 6vw, 80px); }
.split > * { min-width: 0; }
@media (min-width: 900px) and (orientation: landscape) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; } .split.flip > :first-child { order: 2; } }

/* the wrapper's printed band between chapters */
.band { height: 64px; overflow: hidden; border-block: 2px solid var(--blue); background: var(--paper); }
.band .run { display: flex; gap: 0; height: 100%; align-items: center; white-space: nowrap; will-change: transform; }
.band .run span { display: inline-flex; align-items: center; gap: 22px; padding-right: 22px; font: 400 26px/1 var(--f-zh-display); color: var(--blue); letter-spacing: .06em; }
.band .run span em { font: 700 17px/1 var(--f-display); font-style: normal; letter-spacing: .18em; color: var(--red); font-variation-settings: "SOFT" 100, "opsz" 24; }
.band .run svg { width: 46px; height: 33px; }

/* ---------- what it is: 7 candies, one glass ---------- */
.facts3 { display: grid; gap: 14px; margin-top: 28px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.facts3 div { min-width: 0; padding: 16px 14px; border-radius: 18px; background: var(--milk); }
.facts3 b { display: block; font: 700 var(--step-2)/1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 72; color: var(--blue); font-variant-numeric: tabular-nums; }
.facts3 span { display: block; margin-top: 8px; font-size: var(--step--1); line-height: 1.35; color: var(--muted); }
@media (max-width: 420px) { .facts3 { grid-template-columns: 1fr; } .facts3 div { display: flex; align-items: baseline; gap: 12px; } .facts3 span { margin: 0; } }
.glass-box { position: relative; display: grid; justify-items: center; gap: 18px; padding: 24px 12px 20px; border-radius: 28px; background: linear-gradient(180deg, var(--wash), transparent 70%); }
.glass-box svg.glass { width: min(260px, 62vw); height: auto; overflow: visible; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 44px; }
.tray button { width: 64px; height: 30px; border-radius: 8px; position: relative; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), opacity .25s; }
.tray button:hover { transform: translateY(-3px) rotate(-4deg); }
.tray button[disabled] { opacity: .18; transform: scale(.8); cursor: default; }
.tray button svg { width: 100%; height: 100%; display: block; overflow: visible; }
.glass-read { text-align: center; font: 600 var(--step-0)/1.3 var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.glass-read small { display: block; margin-top: 4px; font-weight: 400; font-size: var(--step--1); color: var(--muted); }
.glass-ctl { display: flex; gap: 10px; }
.chip { padding: 10px 16px; border-radius: 999px; font: 600 14px/1 var(--f-body); background: var(--blue); color: #fff; transition: transform .2s; }
.chip.ghost { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 1.5px var(--hair); }
.chip:active { transform: scale(.96); }
.flyer { position: fixed; z-index: 40; left: 0; top: 0; width: 64px; height: 30px; pointer-events: none; will-change: transform; }
.note { margin-top: 14px; font-size: var(--step--1); color: var(--muted); max-width: 60ch; }

/* ---------- history: a horizontal track, the rabbit hops along it ---------- */
.history { position: relative; }
.history .ch-head { padding-top: clamp(80px, 12vh, 150px); }
.h-pin { position: relative; }
.h-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; display: grid; align-content: center; }
.track { display: flex; gap: clamp(18px, 3vw, 36px); padding-left: max(var(--gutter-l), calc((100vw - 1200px) / 2 + 16px)); padding-right: 30vw; will-change: transform; align-items: stretch; }
.card { flex: none; width: min(78vw, 400px); min-width: 0; padding: 26px 22px 24px; border-radius: 26px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--hair), 0 30px 60px -40px rgba(19, 41, 92, .35); display: grid; align-content: start; gap: 10px; position: relative; }
.card .yr { font: 700 clamp(2.6rem, 2rem + 2.4vw, 3.8rem)/1 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; color: var(--red); letter-spacing: -.03em; font-variant-numeric: lining-nums; }
.card h3 { margin: 0; font: 650 var(--step-1)/1.2 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 36; color: var(--blue); text-wrap: balance; }
html:lang(zh-Hans) .card h3 { font: 700 var(--step-1)/1.35 var(--f-zh); }
.card p { margin: 0; font-size: var(--step--1); line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.card .art { height: 56px; display: flex; align-items: end; }
.card .art:empty { display: none; }
.card .art svg { height: 100%; width: auto; overflow: visible; }
.ground { position: relative; height: 150px; margin-top: 10px; }
.ground .line { position: absolute; left: 0; right: 0; bottom: 34px; height: 2px; background: repeating-linear-gradient(90deg, var(--blue) 0 10px, transparent 10px 18px); opacity: .35; }
.ground .dot { position: absolute; bottom: 28px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 0 0 3px var(--red); }
.hop { position: absolute; left: 0; bottom: 36px; width: 120px; height: 85px; will-change: transform; }
.hop svg { width: 100%; height: 100%; overflow: visible; display: block; }
.h-hint { padding-left: max(var(--gutter-l), calc((100vw - 1200px) / 2 + 16px)); font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

/* ---------- 1972 ---------- */
.d72 .big { font: 800 clamp(5rem, 3rem + 13vw, 13rem)/.8 var(--f-display); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; color: var(--red); letter-spacing: -.05em; font-variant-numeric: lining-nums; }
.gift-box { position: relative; display: grid; place-items: center; min-height: 340px; }
.gift-box svg { width: min(420px, 86vw); height: auto; overflow: visible; }
.kilo { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 22px 0 8px; }
.kilo b { font: 750 var(--step-4)/.9 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 144; color: var(--blue); letter-spacing: -.03em; font-variant-numeric: tabular-nums lining-nums; }
.kilo span { font-size: var(--step-1); color: var(--ink); max-width: 26ch; line-height: 1.3; }
.caveat { margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: var(--milk); font-size: var(--step--1); line-height: 1.5; color: var(--ink); max-width: 62ch; }
.caveat b { color: var(--red); }

/* ---------- kinds: the carousel ---------- */
.ring { position: relative; height: clamp(300px, 40vw, 440px); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.ring:active { cursor: grabbing; }
.ring { --iw: clamp(104px, 15vw, 240px); }
.ring .it { position: absolute; left: 50%; top: 52%; width: var(--iw); height: calc(var(--iw) * .4); margin-left: calc(var(--iw) * -.5); margin-top: calc(var(--iw) * -.2); will-change: transform, opacity; }
.ring .it svg { width: 100%; height: 100%; overflow: visible; display: block; }
.ring-name { text-align: center; display: grid; gap: 4px; justify-items: center; min-height: 3.6em; }
.ring-name b { font: 650 var(--step-2)/1.1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 72; color: var(--blue); }
html:lang(zh-Hans) .ring-name b { font: 400 var(--step-2)/1.2 var(--f-zh-display); letter-spacing: .04em; }
.ring-name span { font-size: var(--step--1); color: var(--muted); }
.ring-ctl { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
.ring-ctl button { width: 44px; height: 44px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hair); display: grid; place-items: center; color: var(--blue); }
.ring-ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); margin-top: clamp(30px, 5vh, 54px); }
.stats div { min-width: 0; padding: 18px 18px 16px; border-radius: 20px; box-shadow: inset 0 0 0 1.5px var(--hair); }
.stats b { display: block; font: 700 var(--step-3)/1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 144; color: var(--blue); letter-spacing: -.02em; font-variant-numeric: tabular-nums lining-nums; }
.stats span { display: block; margin-top: 8px; font-size: var(--step--1); color: var(--muted); line-height: 1.4; }

/* ---------- pop culture ---------- */
.pops { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); perspective: 900px; }
@media (max-width: 600px) { .pops { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .pop { padding: 16px 14px; } .pop .ic { width: 48px; height: 48px; } }
.pop { min-width: 0; padding: 22px 20px 20px; border-radius: 24px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--hair); display: grid; gap: 10px; align-content: start; transform-style: preserve-3d; will-change: transform; transition: box-shadow .3s; }
.pop:hover { box-shadow: 0 0 0 1.5px var(--blue), 0 26px 50px -34px rgba(19, 41, 92, .45); }
.pop .ic { width: 64px; height: 64px; }
.pop .ic svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pop .when { font: 700 13px/1 var(--f-body); letter-spacing: .12em; color: var(--red); text-transform: uppercase; font-variant-numeric: lining-nums; }
.pop h3 { margin: 0; font: 650 var(--step-1)/1.2 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 36; color: var(--blue); }
html:lang(zh-Hans) .pop h3 { font: 700 var(--step-1)/1.35 var(--f-zh); }
.pop p { margin: 0; font-size: var(--step--1); line-height: 1.55; }

/* ---------- fun facts: the jar ---------- */
.jar-box { position: relative; height: clamp(380px, 56vh, 560px); touch-action: pan-y; }
#jar { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.fact { position: relative; padding: 26px 24px 22px; border-radius: 28px; background: var(--milk); min-height: 220px; display: grid; align-content: start; gap: 12px; transform-origin: 50% 0; }
.fact .n { font: 700 13px/1 var(--f-body); letter-spacing: .14em; color: var(--red); text-transform: uppercase; font-variant-numeric: tabular-nums; }
html:lang(zh-Hans) .fact .n { letter-spacing: .2em; font-family: var(--f-zh); }
.fact p { margin: 0; font: 500 var(--step-1)/1.45 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 24; color: var(--ink); text-wrap: pretty; }
html:lang(zh-Hans) .fact p { font: 500 var(--step-1)/1.7 var(--f-zh); }
.fact .ctl { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.all-facts { margin-top: 16px; }
.all-facts summary { cursor: pointer; font-weight: 600; color: var(--blue); }
.all-facts ol { margin: 12px 0 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: var(--step--1); }

/* ---------- footer ---------- */
.foot { padding-block: 56px calc(env(safe-area-inset-bottom, 0px) + 56px); background: var(--blue); color: #fff; }
.foot a { color: #fff; }
.foot h2 { margin: 0 0 16px; font: 650 var(--step-2)/1 var(--f-display); font-variation-settings: "SOFT" 100, "opsz" 72; }
html:lang(zh-Hans) .foot h2 { font: 400 var(--step-2)/1.1 var(--f-zh-display); }
.src { display: grid; gap: 18px 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); font-size: var(--step--1); }
.src > div { min-width: 0; }
.src h3 { margin: 0 0 8px; font: 700 12px/1.2 var(--f-body); letter-spacing: .14em; text-transform: uppercase; opacity: .75; }

  "what.sub": "Milk, sugar and butter, cooked, whipped with air and cut into small white rolls.",
  "what.body": "<p>Each candy is a white roll about <b>3 cm long and 1 cm across</b>, made from maltose, sugar, whole milk powder and butter. It weighs about 5 grams and has about 20 kilocalories. Air whipped into the hot candy mass gives it the chew.</p><p>Inside the printed paper twist sits a second, see-through wrapper that you eat. In Chinese it is called 糯米纸, “glutinous rice paper”, but it is a <b>starch film</b> about 0.02 mm thick that melts on the tongue. It keeps the candy from sticking to the paper.</p><p>Generations of Chinese families have repeated that <b>seven White Rabbits make a glass of milk</b>. In calories that is about right. In protein it is about a fifth of a real glass.</p>",
  "what.note": "Seven candies, about 35 g, give about the same energy as a glass of milk (≈ 630 kJ), but only about 1.5 g of protein against about 7.5 g in 250 ml of milk. In 2019 a White Rabbit-flavoured milk finally made the saying come true.",

  "what.body": "<p>Jedes Bonbon ist ein weißes Röllchen, etwa <b>3 cm lang und 1 cm dick</b>, aus Maltose, Zucker, Vollmilchpulver und Butter. Es wiegt rund 5 Gramm und hat etwa 20 Kilokalorien. Die Luft, die in die heiße Bonbonmasse geschlagen wird, macht es so schön zäh.</p><p>Unter dem bedruckten Papier steckt eine zweite, durchsichtige Hülle, die man mitisst. Auf Chinesisch heißt sie 糯米纸, „Klebreispapier“, doch sie ist ein <b>Stärkefilm</b> von etwa 0,02 mm, eigentlich eine Oblate, die auf der Zunge zergeht. Sie verhindert, dass das Bonbon am Papier klebt.</p><p>Generationen chinesischer Familien sagten: <b>Sieben White Rabbits sind ein Glas Milch.</b> Bei den Kalorien stimmt das ungefähr. Beim Eiweiß ist es nur etwa ein Fünftel eines echten Glases.</p>",

 "zh": {
  "hero.eyebrow": "上海 · 始于1943年",
  "hero.title": "<em>奶糖</em>",
  "hero.lede": "一颗来自上海的奶糖，裹着拧成结的印花糖纸，里面还有一层可以吃的糯米纸。",
  "what.sub": "奶粉、糖和黄油熬制、充气打发，再切成一颗颗白色小圆柱。",
  "what.body": "<p>每颗大白兔都是长约<b>3厘米、直径约1厘米</b>的白色小圆柱，原料是麦芽糖、白砂糖、全脂奶粉和黄油。一颗约重5克，热量约20千卡。熬好的糖坯经过充气搅打，才有了那股嚼劲。</p><p>印花糖纸里面还包着一层透明的薄膜，可以直接吃。它叫“糯米纸”，其实不是糯米做的，而是一层约0.02毫米厚的<b>淀粉膜</b>，入口即化，用来防止奶糖粘住糖纸。</p><p>几代中国人都听过一句话：<b>“七粒大白兔奶糖等于一杯牛奶”</b>。按热量算，大致没错；按蛋白质算，只有一杯牛奶的五分之一左右。</p>",
  "what.note": "七颗奶糖约35克，热量与一杯牛奶相当（约630千焦），蛋白质却只有约1.5克，而250毫升牛奶约有7.5克。2019年，大白兔奶糖风味牛奶上市，总算让这句话“成了真”。",
  "hist.sub": "从对标昂贵英国奶糖、印着米老鼠的国产糖，到红白蓝的国民奶糖。",
  "gift.title": "送给总统的糖",
  "gift.body": "<p>1972年1月，尼克松访华前一个月，以黑格为首的美方先遣组途经上海。宾馆里摆着大白兔奶糖，美国客人赞不绝口，据一种说法，临走还把没吃完的装进包里带走。</p><p>据官方媒体的说法，<b>周恩来</b>总理得知后，批示将大白兔奶糖作为国礼送给尼克松总统。爱民糖果厂工人陆秀琴回忆，那天半夜全厂工人被叫回厂里加班，彻夜未眠，终于赶在第二天早晨把糖送到。</p>",
  "gift.kg": "500余斤",
  "gift.kgLabel": "约250公斤：据陆秀琴回忆，这是全厂通宵为美方先遣组赶制的数量。",
  "gift.caveat": "<b>到底送了多少？</b>没有任何1972年的档案记载重量。流传甚广的“每人十斤”找不到可靠出处；英文资料里的“每人10公斤”“500公斤”，则是把“斤”误当成了公斤。据国内媒体报道，此后大白兔出口美国，罐装奶糖成了复活节的抢手货。",
  "kinds.sub": "几十年来只有一种口味：牛奶。2000年代起陆续推出新口味，到2023年已有16种。拖动转盘，或点箭头看看。",
  "pop.sub": "一颗童年的糖，变成了润唇膏、香水、奶茶、时装、艺术品和潮玩。",
  "foot.disc": "本页为爱好者制作的趣味页面，与上海冠生园食品有限公司无关，“大白兔”商标归其所有。页面中的兔子和奶糖均为自行绘制。数据取自能找到的最新公开资料；各方说法不一时，页面已注明。"
 }

<script>
/* ======================================================================

(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);

/* ---------------------------------------------------------------- language */
let LANG = "en";
const t = (k, vars) => {
  let s = (UI[LANG] && UI[LANG][k] != null && UI[LANG][k] !== "") ? UI[LANG][k] : UI.en[k] != null ? UI.en[k] : "";
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.replace("{" + a + "}", b);

};
const pick = o => o ? (o[LANG] != null && o[LANG] !== "" ? o[LANG] : o.en) : "";
function detectLang() {
  try { const s = localStorage.getItem("wr-lang"); if (s && UI[s]) return s; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const p = String(l).toLowerCase();

}
const langHooks = [];
function setLang(l, save) {

  for (const el of $$("[data-i18n]")) el.innerHTML = t(el.dataset.i18n);

}
for (const b of $$(".langs button")) b.addEventListener("click", () => setLang(b.dataset.lang, true));

/* ---------------------------------------------------------------- engine */
const comps = [];

const docTop = el => { let y = 0; for (let n = el; n; n = n.offsetParent) y += n.offsetTop; return y; };

const fpsN = $("#fpsN");
let fCount = 0, fT0 = 0, last = 0;
const progress = $("#progress");
function frame(now) {

  last = now;

  const docH = document.documentElement.scrollHeight - VH;

  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- shared drawing */
function rabbitPath2D() {
  // the same rabbit as #rabbit-sym, for canvases
  return {
    parts: [
      "M162 52 C142 34 128 10 138 4 C149 -2 168 22 182 48 Z",
      "M78 118 C62 128 40 136 20 135 C11 135 11 126 20 125 C40 122 58 112 70 101 Z",
      "M56 104 C46 80 64 56 98 52 C130 48 160 58 174 78 C184 94 174 114 150 120 C120 128 72 128 56 104 Z",
      "M66 84 A12 12 0 1 0 42 84 A12 12 0 1 0 66 84 Z",
      "M186 86 C198 94 210 102 222 106 C229 108 229 99 222 97 C211 93 200 85 192 77 Z",
      "M211 66 A27 23 0 1 0 157 66 A27 23 0 1 0 211 66 Z",
      "M176 48 C166 24 166 2 178 1 C190 0 194 24 192 48 Z",

}
const RAB = rabbitPath2D();
function drawRabbit(g, x, y, s, color = C.blue, lw = 5) {
  g.save(); g.translate(x, y); g.scale(s, s); g.translate(-120, -85);
  g.lineJoin = "round"; g.lineCap = "round"; g.lineWidth = lw; g.strokeStyle = color; g.fillStyle = "#fff";

/* ---------------------------------------------------------------- the printed band */
function buildBands() {
  const rab = '<svg viewBox="0 0 240 170" aria-hidden="true"><use href="#rabbit-sym"/></svg>';
  const unit = `<span>${rab}大白兔<em>WHITE RABBIT</em>奶糖<em>CREAMY CANDY</em></span>`;
  for (const id of ["band1", "band2", "band3"]) $("#" + id).innerHTML = unit.repeat(8);
}
buildBands();
for (const [id, dir] of [["band1", 1], ["band2", -1], ["band3", 1]]) {
  const el = $("#" + id);
  comp(el.parentElement, {
    x: 0, w: 1,
    measure() { const s = el.firstElementChild; this.w = s ? s.offsetWidth : 1; },
    update(dt) {
      // drifts on its own and leans into the scroll

      el.style.transform = `translate3d(${-x}px,0,0)`;
    },

}

/* ======================================================================

   cylinder (its print scrolls round as it spins); the twisted ends open,
   the wrapper parts in two, then the rice-paper film melts away.
   ====================================================================== */
const hero = (() => {
  const el = $("#top"), stage = $(".hero-stage"), cv = $("#candy"), g = cv.getContext("2d");
  const zh = $$(".hero h1 .zh span"), stepsLi = $$("#steps li"), stepBars = $$("#steps .bar2 i");
  let W = 0, H = 0, dpr = 1, top = 0, len = 1, p = 0, spin = 0, ptrX = 0, ptrY = 0, ptx = 0, pty = 0, tIntro = 0;
  let tex = null, texH = 0;

  function buildTex() {
    // the wrapper print, unrolled: 1024 wide (along the candy) by 512 (round it)
    const c = document.createElement("canvas"); c.width = 1024; c.height = 1024;
    const q = c.getContext("2d");
    q.fillStyle = "#fff"; q.fillRect(0, 0, 1024, 1024);

      const o = rep * 512;
      q.fillStyle = C.blue;
      q.fillRect(0, o + 10, 1024, 7); q.fillRect(0, o + 495, 1024, 7);
      q.fillStyle = C.red; q.fillRect(0, o + 24, 1024, 3); q.fillRect(0, o + 485, 1024, 3);
      // 大白兔 large, with the rabbit
      q.font = '400 150px "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif';
      q.textBaseline = "middle"; q.textAlign = "center";
      q.lineWidth = 10; q.strokeStyle = "#fff"; q.lineJoin = "round";
      q.fillStyle = C.blue; q.fillText("大白兔", 600, o + 168);
      drawRabbit(q, 250, o + 160, 1.25, C.blue, 5);
      // WHITE RABBIT in red, CREAMY CANDY in blue
      q.font = '800 76px Fraunces, Georgia, serif';
      q.fillStyle = C.red; q.fillText("WHITE RABBIT", 512, o + 330);
      q.font = '600 34px Figtree, Arial, sans-serif';
      q.fillStyle = C.blue;
      if (q.letterSpacing !== undefined) q.letterSpacing = "10px";
      q.fillText("CREAMY CANDY · 奶糖", 512, o + 412);
      if (q.letterSpacing !== undefined) q.letterSpacing = "0px";
      // little rabbits in the margins
      for (const x of [70, 954]) drawRabbit(q, x, o + 330, .42, C.blue, 6);
    }

  }

  function measure() {
    top = docTop(el); len = Math.max(1, el.offsetHeight - VH);

    g.bezierCurveTo(L / 2 + R * .2, -R, L / 2 + R * .2, R, L / 2 - R * .6, R);

    g.bezierCurveTo(-L / 2 - R * .2, R, -L / 2 - R * .2, -R, -L / 2 + R * .6, -R);

  }

  function drawBody(L, R) {

    gr.addColorStop(0, "#EADCBC"); gr.addColorStop(.16, "#FFFBF1"); gr.addColorStop(.34, "#FFFDF8");
    gr.addColorStop(.62, "#F8EEDA"); gr.addColorStop(.86, "#E6D3AC"); gr.addColorStop(1, "#D6BF92");
    g.fillStyle = gr; g.fill();

    ge.addColorStop(0, "rgba(160,120,60,.20)"); ge.addColorStop(.1, "rgba(160,120,60,0)"); ge.addColorStop(.9, "rgba(160,120,60,0)"); ge.addColorStop(1, "rgba(160,120,60,.22)");

    const sh = g.createLinearGradient(0, -R * 1.2, 0, R * 1.2);
    sh.addColorStop(0, "rgba(19,41,92,.30)"); sh.addColorStop(.12, "rgba(19,41,92,.10)"); sh.addColorStop(.3, "rgba(255,255,255,.35)");
    sh.addColorStop(.42, "rgba(255,255,255,0)"); sh.addColorStop(.72, "rgba(19,41,92,.06)"); sh.addColorStop(.9, "rgba(19,41,92,.2)"); sh.addColorStop(1, "rgba(19,41,92,.34)");
    g.fillStyle = sh; g.fillRect(-xs - E * 1.2, -R * 1.3, L + E * 2.4, R * 2.6);

        const px = side * (xs + E * .42);

          g.beginPath(); g.moveTo(px, 0);

          g.strokeStyle = `rgba(19,41,92,${(.10 + (k % 2) * .08) * tw})`; g.lineWidth = Math.max(1, R * .03); g.stroke();
          g.beginPath(); g.moveTo(px, 0);
          g.quadraticCurveTo(px - side * E * .2, ey * .5, side * xs, half * R * f);
          g.strokeStyle = `rgba(19,41,92,${(.06 + (k % 2) * .06) * tw})`; g.stroke();

    g.strokeStyle = "rgba(29,78,166,.28)"; g.lineWidth = Math.max(1, R * .025); g.stroke();
    g.restore();
  }

  function drawFilm(L, R, film, now) {
    if (film <= .01) return;

    g.fillStyle = `rgba(255,255,255,${.42 * film})`; g.fill();
    g.clip();

    g.strokeStyle = `rgba(150,170,200,${.16 * film})`; g.lineWidth = 1;
    for (let i = -8; i <= 8; i++) { g.beginPath(); const x = i * L / 14; g.moveTo(x - R, -R); g.bezierCurveTo(x - R * .2, -R * .3, x + R * .3, R * .2, x + R * .6, R); g.stroke(); }

    const film = 1 - sstep(.66, .9, p);
    const E = L * lerp(.14, .32, tw);

    disc.addColorStop(0, "rgba(251,246,233,1)"); disc.addColorStop(.7, "rgba(251,246,233,.85)"); disc.addColorStop(1, "rgba(251,246,233,0)");

    sg.addColorStop(0, `rgba(19,41,92,${.16 - bob / R * .03})`); sg.addColorStop(1, "rgba(19,41,92,0)");

  stage.addEventListener("pointermove", e => { const r = stage.getBoundingClientRect(); ptrX = (e.clientX - r.left) / r.width * 2 - 1; ptrY = (e.clientY - r.top) / r.height * 2 - 1; });

  return comp(el, {
    always: false,
    measure,
    update(dt, now) {

      p = REDUCE ? raw : damp(p, raw, 10, dt);

      seg.forEach(([a, b], i) => {
        const k = clamp((p - a) / (b - a), 0, 1);

/* ======================================================================
   WHAT IT IS: seven candies make one glass of milk (the old slogan).
   ====================================================================== */
const glass = (() => {
  const box = $("#glassBox"), tray = $("#tray"), milk = $("#milk"), line = $("#milkLine"), sunk = $("#sunk"), read = $("#glassRead"), svg = $("#glassBox svg.glass");
  const Y0 = 284, Y1 = 64;    // milk level for 0 and 7 candies
  let n = 0, level = 0, vel = 0, slosh = 0;
  const ticks = $("#ticks");
  for (let i = 1; i <= 7; i++) { const y = lerp(Y0, Y1, i / 7); ticks.insertAdjacentHTML("beforeend", `<path d="M${lerp(60, 47, (Y0 - y) / (Y0 - 42)) + 4} ${y.toFixed(1)} h10"/>`); }
  const candySvg = band => `<svg viewBox="0 0 170 68" aria-hidden="true" style="--band:${band}"><use href="#candy-sym"/></svg>`;
  function fillTray() {
    tray.innerHTML = "";

      const b = document.createElement("button");
      b.type = "button"; b.id = "candy-" + i; b.innerHTML = candySvg(C.red);
      b.setAttribute("aria-label", t("glass.tap") + " " + (i + 1));

  }
  function label() {
    read.innerHTML = n >= 7 ? `${t("glass.full")}<small>${t("glass.read", { n: 7 })}</small>` : `${t("glass.read", { n })}<small>${t("glass.tap")}</small>`;
  }
  function drop(btn) {
    if (btn.disabled || n >= 7) return;
    btn.disabled = true;
    const from = btn.getBoundingClientRect(), to = svg.getBoundingClientRect();
    const fl = document.createElement("div"); fl.className = "flyer"; fl.innerHTML = candySvg(C.red);
    document.body.appendChild(fl);
    const x0 = from.left, y0 = from.top, x1 = to.left + to.width * .5 - 32, y1 = to.top + to.height * ((lerp(Y0, Y1, n / 7) - 10) / 300);
    const T = REDUCE ? .01 : .62, peak = Math.min(y0, y1) - 90;
    const t0 = performance.now();
    const step = now => {
      const k = clamp((now - t0) / 1000 / T, 0, 1);
      const x = lerp(x0, x1, k), y = (1 - k) * (1 - k) * y0 + 2 * (1 - k) * k * peak + k * k * y1;
      fl.style.transform = `translate3d(${x}px,${y}px,0) rotate(${k * 300}deg) scale(${lerp(1, .7, k)})`;
      if (k < 1) requestAnimationFrame(step);

    };
    requestAnimationFrame(step);
  }
  function sinkOne() {
    const x = 70 + (n * 37) % 70, y = 268 - (n % 3) * 9;
    sunk.insertAdjacentHTML("beforeend", `<g transform="translate(${x} ${y}) rotate(${(n * 47) % 60 - 30}) scale(.32)" opacity=".55"><use href="#candy-sym" x="-85" y="-34" style="--band:${C.red}"/></g>`);
  }
  $("#pourAll").addEventListener("click", () => { $$("#tray button").filter(b => !b.disabled).forEach((b, i) => setTimeout(() => drop(b), i * (REDUCE ? 0 : 120))); });

  langHooks.push(() => { label(); $$("#tray button").forEach((b, i) => b.setAttribute("aria-label", t("glass.tap") + " " + (i + 1))); });
  fillTray();
  return comp(box, {
    update(dt, now) {
      // the level follows a spring, the surface sloshes and settles
      const target = n / 7;
      const acc = (target - level) * 60 - vel * 9;
      vel += acc * dt; level += vel * dt;
      slosh = damp(slosh, 0, 1.4, dt);
      const y = lerp(Y0, Y1, clamp(level, 0, 1.02));

      }
      milk.setAttribute("d", d + " L190 300 L30 300 Z");
      line.setAttribute("d", l);
    },
    measure() {},
  });
})();

const history = (() => {
  const pin = $("#hPin"), track = $("#track"), ground = $("#ground"), hop = $("#hop"), body = $("#hopBody");

  function render() {
    track.innerHTML = DATA.timeline.map(it => `<article class="card"><div class="art">${ICONS[it.icon] || ""}</div><div class="yr">${it.year}</div><h3>${pick(it.t)}</h3><p>${pick(it.d)}</p></article>`).join("");

})();

/* ======================================================================
   KINDS: a ring of wrapped candies you can spin; the one in front is named.
   ====================================================================== */
const ring = (() => {
  const el = $("#ring"), name = $("#ringName"), note = $("#ringNote");
  let items = [], rot = 0, vel = 0, drag = null, front = -1, target = null, R = 220;
  function render() {
    el.innerHTML = DATA.kinds.map((k, i) => `<div class="it" data-i="${i}"><svg viewBox="0 0 170 68" style="--band:${k.band};--end:${k.end || "#fff"}"><use href="#candy-sym"/></svg></div>`).join("");
    items = $$(".it", el);
    front = -1;
    measure();
  }
  function measure() { R = Math.min(440, Math.max(110, el.clientWidth * .42)); }
  const step = () => (Math.PI * 2) / Math.max(1, items.length);
  el.addEventListener("pointerdown", e => { drag = { x: e.clientX, r: rot, t: performance.now() }; target = null; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", e => { if (!drag) return; const nr = drag.r + (e.clientX - drag.x) / R; const now = performance.now(); vel = (nr - rot) / Math.max(1e-3, (now - drag.t) / 1000); drag.t = now; rot = nr; });
  const up = () => { if (!drag) return; drag = null; target = Math.round(rot / step()) * step() + (vel > 0 ? 1 : -1) * Math.round(Math.min(3, Math.abs(vel) / 6)) * step(); };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  $("#ringPrev").addEventListener("click", () => { target = (Math.round(rot / step()) + 1) * step(); });
  $("#ringNext").addEventListener("click", () => { target = (Math.round(rot / step()) - 1) * step(); });
  langHooks.push(() => { front = -1; });
  return comp(el, {
    render, measure,
    update(dt, now) {
      if (!items.length) return;
      if (!drag) {
        if (target != null) { rot = damp(rot, target, 7, dt); if (Math.abs(rot - target) < 1e-4) target = null; vel = 0; }
        else if (!REDUCE) { rot += dt * -.18; }
      }
      const n = items.length;
      let best = -1, bz = -9;
      items.forEach((it, i) => {
        const a = i * step() + rot;
        const x = Math.sin(a) * R, z = Math.cos(a);
        // a tilted ring: the back row sits higher, smaller and paler, so the front reads clearly
        const s = lerp(.42, 1.2, Math.pow((z + 1) / 2, 1.3));
        const y = -z * R * .3 + (REDUCE ? 0 : Math.sin(now * 1.3 + i) * 4);
        it.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) rotate(${(Math.sin(a) * -14).toFixed(2)}deg) scale(${s.toFixed(3)})`;
        it.style.opacity = lerp(.18, 1, Math.pow((z + 1) / 2, 1.6)).toFixed(3);
        it.style.zIndex = String(Math.round(z * 100) + 100);
        if (z > bz) { bz = z; best = i; }
      });
      if (best !== front) {

})();

/* ======================================================================
   FUN FACTS: a glass jar of candies with a little physics. Each candy is
   a capsule (two points kept a fixed distance apart); tap one to pop it
   out and read a fact.
   ====================================================================== */
const jar = (() => {
  const box = $("#jarBox"), cv = $("#jar"), g = cv.getContext("2d");
  const factN = $("#factN"), factText = $("#factText"), card = $("#factCard");
  let W = 0, H = 0, dpr = 1, J = null, candies = [], fi = 0, flip = 0, shown = 0;
  const N = 20;
  function geom() {
    const w = Math.min(W * .78, H * .7), h = Math.min(H * .78, w * 1.25);
    const x0 = (W - w) / 2, y1 = H - 16, y0 = y1 - h;
    return { x0, x1: x0 + w, y0, y1, r: w * .14, neck: w * .74, cr: Math.max(9, w * .045) };
  }
  function makeCandy(i, seed) {
    const r = J.cr, len = r * 2.6;
    const x = lerp(J.x0 + r * 2, J.x1 - r * 2, ((i * 0.618034 + seed) % 1));
    const y = J.y0 - r * 2 - (i % 7) * r * 2.4 - Math.floor(i / 7) * r * 3;
    const a = (i * 1.7) % Math.PI;
    const c = { r, len, band: [C.red, C.blue, "#E8A23A", "#3E8E5E", "#8A4B2A"][i % 5], pop: 0 };
    c.p = [[x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2], [x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2]];
    c.o = c.p.map(q => q.slice());
    return c;
  }
  function reset() { candies = []; for (let i = 0; i < N; i++) candies.push(makeCandy(i, .13)); for (let s = 0; s < 480; s++) sim(1 / 120); }
  function measure() {
    dpr = DPR(); W = box.clientWidth; H = box.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const nj = geom();
    if (!J || Math.abs(nj.cr - J.cr) > .5 || Math.abs(nj.x0 - J.x0) > 1) { J = nj; reset(); } else J = nj;
  }
  function wall(q, r) {
    // keep a point inside the jar: straight sides, rounded bottom corners, open top
    const { x0, x1, y1, r: cr } = J;
    if (q[1] > y1 - cr) {
      for (const cx of [x0 + cr, x1 - cr]) {
        const inCorner = cx < (x0 + x1) / 2 ? q[0] < cx : q[0] > cx;
        if (inCorner) { const dx = q[0] - cx, dy = q[1] - (y1 - cr), d = Math.hypot(dx, dy), lim = cr - r; if (d > lim) { q[0] = cx + dx / d * lim; q[1] = (y1 - cr) + dy / d * lim; } }
      }
    }
    if (q[0] < x0 + r) q[0] = x0 + r;
    if (q[0] > x1 - r) q[0] = x1 - r;
    if (q[1] > y1 - r) q[1] = y1 - r;
  }
  function closest(a0, a1, b0, b1) {
    // closest points between segments a and b (parameters s, t)
    const d1 = [a1[0] - a0[0], a1[1] - a0[1]], d2 = [b1[0] - b0[0], b1[1] - b0[1]], r = [a0[0] - b0[0], a0[1] - b0[1]];
    const aa = d1[0] * d1[0] + d1[1] * d1[1], e = d2[0] * d2[0] + d2[1] * d2[1], f = d2[0] * r[0] + d2[1] * r[1];
    const c = d1[0] * r[0] + d1[1] * r[1], b = d1[0] * d2[0] + d1[1] * d2[1], den = aa * e - b * b;
    let s = den > 1e-9 ? clamp((b * f - c * e) / den, 0, 1) : 0;
    let tt = (b * s + f) / e;
    if (tt < 0) { tt = 0; s = clamp(-c / aa, 0, 1); } else if (tt > 1) { tt = 1; s = clamp((b - c) / aa, 0, 1); }
    return [s, tt];
  }
  function sim(dt) {
    const gy = 2200;
    for (const c of candies) {
      for (let k = 0; k < 2; k++) {
        const q = c.p[k], o = c.o[k];
        const vx = (q[0] - o[0]) * .995, vy = (q[1] - o[1]) * .995;
        o[0] = q[0]; o[1] = q[1];
        q[0] += vx; q[1] += vy + gy * dt * dt;
      }
    }
    for (let it = 0; it < 4; it++) {
      for (const c of candies) {
        // keep the capsule's length
        const [a, b] = c.p, dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, k = (d - c.len) / d / 2;
        a[0] += dx * k; a[1] += dy * k; b[0] -= dx * k; b[1] -= dy * k;
      }
      for (let i = 0; i < candies.length; i++) for (let j = i + 1; j < candies.length; j++) {
        const A = candies[i], B = candies[j];
        if (A.pop || B.pop) continue;
        const [s, tt] = closest(A.p[0], A.p[1], B.p[0], B.p[1]);

        const dx = pb[0] - pa[0], dy = pb[1] - pa[1], d = Math.hypot(dx, dy), min = A.r + B.r;
        if (d < min && d > 1e-6) {
          const push = (min - d) / d * .5, px = dx * push, py = dy * push;
          A.p[0][0] -= px * (1 - s); A.p[0][1] -= py * (1 - s); A.p[1][0] -= px * s; A.p[1][1] -= py * s;
          B.p[0][0] += px * (1 - tt); B.p[0][1] += py * (1 - tt); B.p[1][0] += px * tt; B.p[1][1] += py * tt;
        }
      }
      for (const c of candies) if (!c.pop) { wall(c.p[0], c.r); wall(c.p[1], c.r); }
    }
  }
  function drawCandy(c) {
    const [a, b] = c.p, cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2, ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const L = c.len + c.r * .4, R = c.r;
    g.save(); g.translate(cx, cy); g.rotate(ang);
    if (c.pop) g.globalAlpha = 1 - sstep(.5, 1, c.pop);
    // twisted ends
    g.fillStyle = "#fff"; g.strokeStyle = C.blue; g.lineWidth = 1.4; g.lineJoin = "round";
    for (const s of [-1, 1]) {
      g.beginPath(); g.moveTo(s * L / 2, -R * .55); g.lineTo(s * (L / 2 + R * .5), -R * .1); g.lineTo(s * (L / 2 + R * 1.1), -R * .9); g.lineTo(s * (L / 2 + R * .95), 0); g.lineTo(s * (L / 2 + R * 1.1), R * .9); g.lineTo(s * (L / 2 + R * .5), R * .1); g.lineTo(s * L / 2, R * .55); g.closePath(); g.fill(); g.stroke();
    }
    g.beginPath(); g.roundRect ? g.roundRect(-L / 2, -R, L, R * 2, R * .8) : g.rect(-L / 2, -R, L, R * 2);
    g.fillStyle = "#fff"; g.fill();
    g.fillStyle = c.band; g.fillRect(-L / 2 + 1, -R * .28, L - 2, R * .56);
    const sh = g.createLinearGradient(0, -R, 0, R); sh.addColorStop(0, "rgba(19,41,92,.18)"); sh.addColorStop(.35, "rgba(255,255,255,0)"); sh.addColorStop(1, "rgba(19,41,92,.22)");
    g.fillStyle = sh; g.fill();
    g.strokeStyle = C.blue; g.lineWidth = 1.6; g.stroke();
    g.restore();
  }
  function draw(now) {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { x0, x1, y0, y1, r } = J;
    // jar back
    g.fillStyle = "rgba(29,78,166,.05)";
    g.beginPath(); g.moveTo(x0, y0 + 10); g.lineTo(x0, y1 - r); g.quadraticCurveTo(x0, y1, x0 + r, y1); g.lineTo(x1 - r, y1); g.quadraticCurveTo(x1, y1, x1, y1 - r); g.lineTo(x1, y0 + 10); g.closePath(); g.fill();
    for (const c of candies) drawCandy(c);
    // glass front: outline and highlights
    g.lineWidth = 3.5; g.strokeStyle = C.blue; g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath(); g.moveTo(x0 - 8, y0); g.quadraticCurveTo(x0, y0, x0, y0 + 14); g.lineTo(x0, y1 - r); g.quadraticCurveTo(x0, y1, x0 + r, y1); g.lineTo(x1 - r, y1); g.quadraticCurveTo(x1, y1, x1, y1 - r); g.lineTo(x1, y0 + 14); g.quadraticCurveTo(x1, y0, x1 + 8, y0); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 8;
    g.beginPath(); g.moveTo(x0 + 16, y0 + 40); g.lineTo(x0 + 16, y1 - r - 10); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(x0 + 30, y0 + 40); g.lineTo(x0 + 30, y0 + 120); g.stroke();
    // the lid, set aside on its rim
    const lw = (x1 - x0) * .86, lx = (x0 + x1) / 2 + (x1 - x0) * .1, ly = y0 - 34 + (REDUCE ? 0 : Math.sin(now * 1.2) * 3);
    g.fillStyle = "rgba(19,41,92,.07)"; g.beginPath(); g.ellipse((x0 + x1) / 2, y0 + 4, (x1 - x0) * .5, 6, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.translate(lx, ly); g.rotate(.2);
    g.fillStyle = C.red; g.beginPath(); g.roundRect ? g.roundRect(-lw / 2, -14, lw, 24, 8) : g.rect(-lw / 2, -14, lw, 24); g.fill();
    g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(-lw / 2 + 10, -10, lw - 20, 4);
    g.fillStyle = C.red; g.beginPath(); g.arc(0, -18, 10, 0, Math.PI * 2); g.fill();
    g.restore();
    // a paper label with the rabbit
    const lyy = lerp(y0, y1, .58), lw2 = (x1 - x0) * .5;
    g.fillStyle = "rgba(255,255,255,.92)"; g.strokeStyle = "rgba(29,78,166,.5)"; g.lineWidth = 1.5;
    g.beginPath(); g.roundRect ? g.roundRect((x0 + x1) / 2 - lw2 / 2, lyy - 26, lw2, 52, 10) : g.rect((x0 + x1) / 2 - lw2 / 2, lyy - 26, lw2, 52); g.fill(); g.stroke();
    drawRabbit(g, (x0 + x1) / 2 - lw2 * .22, lyy + 2, .2, C.blue, 9);
    g.fillStyle = C.blue; g.font = '400 22px "ZCOOL QingKe HuangYou", "Noto Sans SC", sans-serif'; g.textAlign = "left"; g.textBaseline = "middle";
    g.fillText("大白兔", (x0 + x1) / 2 - lw2 * .02, lyy + 1);
  }
  function showFact(i, animate) {
    const F = DATA.facts;
    if (!F.length) return;
    fi = ((i % F.length) + F.length) % F.length;
    factN.textContent = t("facts.n", { i: fi + 1, n: F.length });
    factText.innerHTML = pick(F[fi]);
    if (animate && !REDUCE) flip = 1;
  }
  function popCandy(c) {
    c.pop = .001;
    const [a, b] = c.p;
    for (const q of [a, b]) { const o = c.o[c.p.indexOf(q)]; o[0] = q[0] + (Math.random() - .5) * 6; o[1] = q[1] + 26; }
    showFact(fi + 1, true);
  }
  cv.addEventListener("pointerdown", e => {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9;
    for (const c of candies) {
      if (c.pop) continue;
      const [a, b] = c.p, dx = b[0] - a[0], dy = b[1] - a[1];
      const s = clamp(((x - a[0]) * dx + (y - a[1]) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      const d = Math.hypot(a[0] + dx * s - x, a[1] + dy * s - y);
      if (d < bd) { bd = d; best = c; }
    }
    if (best && bd < best.r * 2.2) popCandy(best);
    else { for (const c of candies) for (const k of [0, 1]) { c.o[k][0] -= (Math.random() - .5) * 4; c.o[k][1] += 5; } }
  });
  $("#factNext").addEventListener("click", () => { const live = candies.filter(c => !c.pop); if (live.length) popCandy(live.reduce((a, c) => (c.p[0][1] < a.p[0][1] ? c : a))); else showFact(fi + 1, true); });
  function renderList() { $("#factList").innerHTML = DATA.facts.map(f => `<li>${pick(f)}</li>`).join(""); showFact(fi, false); }
  langHooks.push(renderList);
  return comp(box, {
    measure, renderList,
    update(dt, now) {
      if (!J) return;
      const steps = Math.min(4, Math.max(1, Math.round(dt * 120)));
      for (let s = 0; s < steps; s++) sim(dt / steps);
      for (const c of candies) if (c.pop) {
        c.pop += dt / 1.1;
        if (c.pop >= 1) { const i = candies.indexOf(c); candies[i] = makeCandy(i, (now * .37) % 1); candies[i].p.forEach(q => q[1] = J.y0 - J.cr * 3); candies[i].o = candies[i].p.map(q => q.slice()); }
      }
      draw(now);
      flip = damp(flip, 0, 7, dt);
      card.style.transform = flip > .002 ? `perspective(800px) rotateX(${(flip * 24).toFixed(2)}deg) translateY(${(flip * -10).toFixed(2)}px)` : "";
    },
  });
})();

/* ---------------------------------------------------------------- counters: roll up when first seen (they rest at their final value) */
const counted = new WeakSet();
const cio = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting || counted.has(e.target) || REDUCE) return;
  counted.add(e.target);
  const el = e.target, txt = el.textContent, m = txt.match(/\d[\d.,\u202f\u00a0 ]*\d|\d/);
  if (!m) return;
  const raw = m[0], num = parseInt(raw.replace(/\D/g, ""), 10);
  if (!isFinite(num) || num < 10) return;
  const grouped = /\D/.test(raw), sep = grouped ? raw.match(/\D/)[0] : "";
  const fmt = v => { const s = String(Math.round(v)); return grouped ? s.replace(/\B(?=(\d{3})+(?!\d))/g, sep) : s; };
  const t0 = performance.now(), T = 1100;
  const step = now => { const k = clamp((now - t0) / T, 0, 1), e2 = 1 - Math.pow(1 - k, 3); el.textContent = txt.replace(raw, fmt(num * e2)); if (k < 1) requestAnimationFrame(step); else el.textContent = txt; };
  requestAnimationFrame(step);
}), { threshold: .6 });

/* ---------------------------------------------------------------- static sections */
function renderStatic() {
  $("#facts3").innerHTML = DATA.facts3.map(f => `<div><b>${pick(f.v)}</b><span>${pick(f.l)}</span></div>`).join("");
  $("#stats").innerHTML = DATA.stats.map(f => `<div><b${f.count ? " data-count" : ""}>${pick(f.v)}</b><span>${pick(f.l)}</span></div>`).join("");
  $("#sources").innerHTML = DATA.sources.map(gp => `<div><h3>${pick(gp.h)}</h3><ul>${gp.items.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></li>`).join("")}</ul></div>`).join("");
  $$("[data-count]").forEach(el => cio.observe(el));
}
langHooks.push(renderStatic);

/* ---------------------------------------------------------------- start */
const ICONS = window.WR_ICONS || {};
async function start() {
  setLang(detectLang(), false);
  history.render(); ring.render(); pops.render(); jar.renderList();
  measureAll();
  try { await Promise.all(['400 150px "ZCOOL QingKe HuangYou"', "800 76px Fraunces", "600 34px Figtree"].map(f => document.fonts.load(f))); } catch (e) {}
  hero.init();
  measureAll();
  requestAnimationFrame(frame);
}
start();
})();
</script>
